          const accentColor = room.id === 'room-all'
            ? '#58A6FF' : room.id === 'room-vol' ? '#3FB950' : '#F78166';

          useEffect(() => {
            if (listRef.current) {
              listRef.current.scrollTop = listRef.current.scrollHeight;
            }
          }, [messages]);

          const send = () => {
            const txt = draft.trim();
            if (!txt) return;
            sendChatMessage(room.id, {
              id: 'msg-' + Math.random().toString(36).slice(2, 8),
              sender_name: session.name,
              sender_role: role,
              text: txt,
              ts: Date.now(),
            });
            setDraft('');
          };

          const badgeColor = (r) =>
            r === 'CIVILIAN' ? '#58A6FF' : r === 'VOLUNTEER' ? '#3FB950' : '#F78166';
          const badgeLabel = (r) => ROLES[r].badge;

          const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          return (
            <div className="flex flex-col" style={{ height: 'calc(100vh - 3rem - 3.5rem)' }}>
              {/* In-screen header */}
              <div
                className="flex items-center gap-3 px-3 py-2.5 border-b border-zinc-800 shrink-0"
                style={{ borderBottomColor: accentColor + '55' }}
              >
                {onBack && (
                  <button onClick={onBack} className="text-zinc-400 hover:text-zinc-100 transition-colors">
                    <ChevronLeft size={18} strokeWidth={2.5} />
                  </button>
                )}
                <Hash size={13} style={{ color: accentColor }} strokeWidth={2.5} />
                <span className="font-mono text-xs font-semibold tracking-wider" style={{ color: accentColor }}>
                  {room.name.toUpperCase()}
                </span>
                <span className="font-mono text-[9px] text-zinc-600 ml-auto">{messages.length} MSG</span>
              </div>

              {/* Message list */}
              <div ref={listRef} className="flex-1 overflow-y-auto px-3 py-3 space-y-3">
                {messages.map((msg) => {
                  const isSelf = msg.sender_name === session.name && msg.sender_role === role;
                  return (
                    <div key={msg.id} className={`flex gap-2 ${isSelf ? 'flex-row-reverse' : ''}`}>
                      {!isSelf && (
                        <div
                          className="shrink-0 w-7 h-7 flex items-center justify-center font-mono text-[8px] font-bold mt-0.5"
                          style={{
                            background: badgeColor(msg.sender_role) + '22',
                            border: `1px solid ${badgeColor(msg.sender_role)}44`,
                            color: badgeColor(msg.sender_role),
                          }}
                        >
                          {badgeLabel(msg.sender_role)}
                        </div>
                      )}
                      <div className={`max-w-[75%] ${isSelf ? 'items-end' : 'items-start'} flex flex-col gap-0.5`}>
                        {!isSelf && (
                          <div className="flex items-center gap-1.5">
                            <span className="font-mono text-[9px] font-semibold" style={{ color: badgeColor(msg.sender_role) }}>
                              {msg.sender_name}
                            </span>
                            <span className="font-mono text-[8px] text-zinc-700">{fmtTime(msg.ts)}</span>
                          </div>
                        )}
                        <div
                          className="px-3 py-2 text-[11px] leading-relaxed"
                          style={isSelf
                            ? { background: ROLES[role].accent + '22', border: `1px solid ${ROLES[role].accent}44`, color: '#f4f4f5' }
                            : { background: '#161922', border: '1px solid #1F2230', color: '#d4d4d8' }
                          }
                        >
                          {msg.text}
                        </div>
                        {isSelf && (
                          <span className="font-mono text-[8px] text-zinc-700">{fmtTime(msg.ts)}</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Input bar */}
              <div className="shrink-0 border-t border-zinc-800 px-3 py-2.5 flex items-center gap-2 bg-ink-950/90">
                <input
                  value={draft}
                  onChange={(e) => setDraft(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && send()}
                  placeholder="Message..."
                  className="flex-1 bg-ink-800 border border-zinc-700 focus:border-zinc-500 text-[11px] text-zinc-100 placeholder-zinc-600 px-3 py-2 outline-none font-mono"
                />
                <button
                  onClick={send}
                  disabled={!draft.trim()}
                  className="w-9 h-9 flex items-center justify-center transition-colors disabled:opacity-30"
                  style={{ background: ROLES[role].accent + '22', border: `1px solid ${ROLES[role].accent}55`, color: ROLES[role].accent }}
                >
                  <Send size={14} strokeWidth={2.5} />
                </button>
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // DM CONVERSATION — 1-on-1 chat with a peer
        // ───────────────────────────────────────────────────────────────
        function DMConversation({ peer, onBack }) {
          const { session, directMessages, sendDM } = useApp();
          const messages   = directMessages[peer.id] || [];
          const [draft, setDraft] = useState('');
          const listRef    = useRef(null);
          const peerAccent = ROLES[peer.role]?.accent || '#a1a1aa';
          const selfAccent = ROLES[session.role]?.accent || '#a1a1aa';

          useEffect(() => {
            if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
          }, [messages]);

          const send = () => {
            const txt = draft.trim();
            if (!txt) return;
            sendDM(peer.id, {
              id: 'dm-' + Math.random().toString(36).slice(2, 8),
              sender_node_id: 'node-self',
              sender_name: session.name,
              text: txt,
              ts: Date.now(),
            });
            setDraft('');
          };

          const fmtTime = (ts) =>
            new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          return (
            <div className="flex flex-col" style={{ height: 'calc(100vh - 3rem - 3.5rem)' }}>
              {/* Header */}
              <div className="flex items-center gap-3 px-3 py-2.5 border-b border-zinc-800 shrink-0">
                <button onClick={onBack} className="text-zinc-400 hover:text-zinc-100 transition-colors">
                  <ChevronLeft size={18} strokeWidth={2.5} />
                </button>
                <div
                  className="shrink-0 w-9 h-9 flex items-center justify-center font-mono text-[9px] font-bold"
                  style={{ background: peerAccent + '22', border: `1px solid ${peerAccent}44`, color: peerAccent }}
                >
                  {ROLES[peer.role]?.badge}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-[13px] font-semibold text-zinc-100 truncate">{peer.name}</div>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span
                      className="w-1.5 h-1.5 rounded-full"
                      style={{ background: peer.status === 'online' ? '#3FB950' : '#52525b' }}
                    />
                    <span className="font-mono text-[9px] tracking-widest text-zinc-500">
                      {peer.status === 'online' ? 'ONLINE' : 'LAST SEEN ' + timeAgo(peer.last_seen).toUpperCase()}
                    </span>
                  </div>
                </div>
                <span className="font-mono text-[9px] text-zinc-600 shrink-0">{messages.length} MSG</span>
              </div>

              {/* Message list */}
              <div ref={listRef} className="flex-1 overflow-y-auto px-3 py-3 space-y-3">
                {messages.length === 0 && (
                  <div className="flex flex-col items-center justify-center h-full gap-2 text-zinc-700">
                    <MessageSquare size={28} strokeWidth={1.5} />
                    <span className="font-mono text-[10px] tracking-widest">START THE CONVERSATION</span>
                  </div>
                )}
                {messages.map((msg) => {
                  const isSelf = msg.sender_node_id === 'node-self';
                  return (
                    <div key={msg.id} className={`flex gap-2 ${isSelf ? 'flex-row-reverse' : ''}`}>
                      {!isSelf && (
                        <div
                          className="shrink-0 w-7 h-7 flex items-center justify-center font-mono text-[8px] font-bold mt-0.5"
                          style={{ background: peerAccent + '22', border: `1px solid ${peerAccent}44`, color: peerAccent }}
                        >
                          {ROLES[peer.role]?.badge}
                        </div>
                      )}
                      <div className={`max-w-[75%] flex flex-col gap-0.5 ${isSelf ? 'items-end' : 'items-start'}`}>
                        {!isSelf && (
                          <div className="flex items-center gap-1.5">
                            <span className="font-mono text-[9px] font-semibold" style={{ color: peerAccent }}>
                              {peer.name}
                            </span>
                            <span className="font-mono text-[8px] text-zinc-700">{fmtTime(msg.ts)}</span>
                          </div>
                        )}
                        <div
                          className="px-3 py-2 text-[11px] leading-relaxed"
                          style={isSelf
                            ? { background: selfAccent + '22', border: `1px solid ${selfAccent}44`, color: '#f4f4f5' }
                            : { background: '#161922', border: '1px solid #1F2230', color: '#d4d4d8' }
                          }
                        >
                          {msg.text}
                        </div>
                        {isSelf && (
                          <span className="font-mono text-[8px] text-zinc-700">{fmtTime(msg.ts)}</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Input bar */}
              <div className="shrink-0 border-t border-zinc-800 px-3 py-2.5 flex items-center gap-2 bg-ink-950/90">
                <input
                  value={draft}
                  onChange={(e) => setDraft(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && !e.shiftKey && send()}
                  placeholder={`Message ${peer.name.split(' ')[0]}…`}
                  className="flex-1 bg-ink-800 border border-zinc-700 focus:border-zinc-500 text-[11px] text-zinc-100 placeholder-zinc-600 px-3 py-2 outline-none font-mono"
                />
                <button
                  onClick={send}
                  disabled={!draft.trim()}
                  className="w-9 h-9 flex items-center justify-center transition-colors disabled:opacity-30"
                  style={{ background: selfAccent + '22', border: `1px solid ${selfAccent}55`, color: selfAccent }}
                >
                  <Send size={14} strokeWidth={2.5} />
                </button>
              </div>
            </div>
          );
        }

        function ChatScreen() {
          const { session, directMessages } = useApp();
          const role  = session.role;
          const rooms = MOCK_CHAT_ROOMS.filter((r) => r.access.includes(role));

          const [activeTab,    setActiveTab]    = useState('channels');
          const [activeRoomId, setActiveRoomId] = useState(
            role === 'CIVILIAN' ? 'room-all' : null
          );
          const [activePeerId, setActivePeerId] = useState(null);

          // Civilians always see room-all directly
          if (role === 'CIVILIAN') {
            const room = MOCK_CHAT_ROOMS.find((r) => r.id === 'room-all');
            return <ChatRoom room={room} onBack={null} />;
          }

          // Open a channel room
          if (activeRoomId) {
            const room = MOCK_CHAT_ROOMS.find((r) => r.id === activeRoomId);
            return <ChatRoom room={room} onBack={() => setActiveRoomId(null)} />;
          }

          // Open a DM conversation
          if (activePeerId) {
            const peer = MOCK_MESH_PEERS.find((p) => p.id === activePeerId);
            return <DMConversation peer={peer} onBack={() => setActivePeerId(null)} />;
          }

          // Peers visible to this role
          const peers = MOCK_MESH_PEERS.filter((p) =>
            role === 'AUTHORITY' ? true : (p.role === 'CIVILIAN' || p.role === 'VOLUNTEER')
          );
          const peersWithThreads = peers.filter((p) => (directMessages[p.id] || []).length > 0);

          const getLastMsg = (peerId) => {
            const t = directMessages[peerId];
            return t && t.length ? t[t.length - 1] : null;
          };

          const accent = ROLES[role].accent;

          return (
            <div className="flex flex-col" style={{ height: 'calc(100vh - 3rem - 3.5rem)' }}>
              {/* Tab strip */}
              <div className="flex border-b border-zinc-800 shrink-0">
                {[
                  { id: 'channels', label: 'CHANNELS', badge: rooms.length },
                  { id: 'direct',   label: 'DIRECT',   badge: peersWithThreads.length || null },
                ].map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setActiveTab(t.id)}
                    className="relative flex-1 py-2.5 font-mono text-[10px] tracking-widest transition-colors"
                    style={activeTab === t.id ? { color: accent } : { color: '#52525b' }}
                  >
                    {t.label}
                    {t.badge !== null && (
                      <span className="ml-1 font-mono text-[9px]">({t.badge})</span>
                    )}
                    {activeTab === t.id && (
                      <span className="absolute bottom-0 left-0 right-0 h-0.5" style={{ background: accent }} />
                    )}
                  </button>
                ))}
              </div>

              {/* CHANNELS */}
              {activeTab === 'channels' && (
                <div className="px-3 pt-3 pb-28 space-y-2 overflow-y-auto flex-1">
                  <div className="font-mono text-[10px] tracking-widest text-zinc-500 mb-1">
                    {rooms.length} CHANNEL{rooms.length !== 1 ? 'S' : ''}
                  </div>
                  {rooms.map((room) => (
                    <RoomCard
                      key={room.id}
                      room={room}
                      role={role}
                      onClick={() => setActiveRoomId(room.id)}
                    />
                  ))}
                </div>
              )}

              {/* DIRECT */}
              {activeTab === 'direct' && (
                <div className="overflow-y-auto flex-1 pb-28">
                  <div className="px-3 pt-3 pb-1 font-mono text-[10px] tracking-widest text-zinc-500">
                    {peers.length} PEER{peers.length !== 1 ? 'S' : ''} IN MESH
                  </div>
                  {peers.map((peer) => {
                    const last       = getLastMsg(peer.id);
                    const peerAccent = ROLES[peer.role]?.accent || '#a1a1aa';
                    return (
                      <button
                        key={peer.id}
                        onClick={() => setActivePeerId(peer.id)}
                        className="w-full flex items-center gap-3 px-3 py-3 border-b border-zinc-800/60 hover:bg-zinc-900/40 text-left transition-colors"
                      >
                        {/* Avatar with online dot */}
                        <div className="relative shrink-0">
                          <div
                            className="w-10 h-10 flex items-center justify-center font-mono text-[10px] font-bold"
                            style={{ background: peerAccent + '22', border: `1px solid ${peerAccent}44`, color: peerAccent }}
                          >
                            {ROLES[peer.role]?.badge}
                          </div>
                          <span
                            className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-ink-950"
                            style={{ background: peer.status === 'online' ? '#3FB950' : '#52525b' }}
                          />
                        </div>
                        {/* Info */}
                        <div className="flex-1 min-w-0">
                          <div className="flex items-baseline justify-between gap-1">
                            <span className="text-[13px] font-medium text-zinc-100 truncate">{peer.name}</span>
                            {last && (
                              <span className="font-mono text-[9px] text-zinc-600 shrink-0">{timeAgo(last.ts)}</span>
                            )}
                          </div>
                          <div className="font-mono text-[9px] tracking-widest mt-0.5" style={{ color: peerAccent }}>
                            {peer.role}
                          </div>
                          {last ? (
                            <div className="text-[11px] text-zinc-500 truncate mt-0.5">
                              {last.sender_node_id === 'node-self' ? 'You: ' : ''}{last.text}
                            </div>
                          ) : (
                            <div className="font-mono text-[9px] text-zinc-700 mt-0.5">No messages yet</div>
                          )}
                        </div>
                        <ChevronRight size={14} className="text-zinc-700 shrink-0" />
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // BOTTOM NAVIGATION — civilians see 3 tabs, others see 5
        // ───────────────────────────────────────────────────────────────
        function BottomNav({ active, onChange, role }) {
          // Civilians: HOME · COMMS · AI  (no tactical map, no node info)
          const civilianItems = [
            { id: 'home',      icon: Home,          label: 'HOME'  },
            { id: 'chat',      icon: MessageSquare, label: 'COMMS' },
            { id: 'assistant', icon: Bot,           label: 'AI'    },
          ];
          const operatorItems = [
            { id: 'home',      icon: Home,          label: role === 'AUTHORITY' ? 'CMD' : 'TASKS' },
            { id: 'map',       icon: MapPin,         label: 'MAP'   },
            { id: 'chat',      icon: MessageSquare,  label: 'COMMS' },
            { id: 'assistant', icon: Bot,            label: 'AI'    },
            { id: 'profile',   icon: User,           label: 'NODE'  },
          ];
          const items  = role === 'CIVILIAN' ? civilianItems : operatorItems;
          const cols   = role === 'CIVILIAN' ? 'grid-cols-3' : 'grid-cols-5';
          const accent = ROLES[role].accent;

          return (
            <nav className="fixed bottom-0 inset-x-0 z-30 bg-ink-950/95 backdrop-blur border-t border-zinc-900">
              <div className={`grid ${cols}`}>
                {items.map((it) => {
                  const Icon = it.icon;
                  const isActive = active === it.id;
                  return (
                    <button
                      key={it.id}
                      onClick={() => onChange(it.id)}
                      className="relative flex flex-col items-center justify-center py-2.5 gap-0.5"
                      style={isActive ? { color: accent } : { color: '#71717a' }}
                    >
                      <Icon size={18} strokeWidth={isActive ? 2.4 : 2} />
                      <span className="font-mono text-[9px] tracking-widest">{it.label}</span>
                      {isActive && (
                        <span
                          className="absolute top-0 left-1/2 -translate-x-1/2 w-8 h-0.5"
                          style={{ background: accent }}
                        />
                      )}
                    </button>
                  );
                })}
              </div>
            </nav>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // PROFILE / SETTINGS
        // ───────────────────────────────────────────────────────────────
        function ProfileScreen({ session, peerCount, battery, aiState, onLogout, onSwitchRole }) {
          const role = ROLES[session.role];
          const RIcon = role.icon;
          return (
            <div className="px-3 pt-3 pb-28 space-y-5">
              {/* Identity card */}
              <TacticalCorners accent={role.accent + '88'} className="bg-ink-900/60 border border-zinc-800 p-4">
                <div className="flex items-center gap-3">
                  <div
                    className="w-14 h-14 flex items-center justify-center rounded-sm"
                    style={{ background: role.accent + '18', border: `1px solid ${role.accent}55`, color: role.accent }}
                  >
                    <RIcon size={26} strokeWidth={2.2} />
                  </div>
                  <div className="flex-1">
                    <div className="text-lg text-zinc-100 font-semibold">{session.name}</div>
                    <div className="flex items-center gap-2 mt-0.5">
                      <span className="font-mono text-[10px] tracking-widest" style={{ color: role.accent }}>
                        [{role.badge}]
                      </span>
                      <span className="font-mono text-[10px] tracking-widest text-zinc-500">
                        {role.label.toUpperCase()}
                      </span>
                    </div>
                  </div>
                </div>
                <div className="mt-4 grid grid-cols-3 gap-2 font-mono text-[10px] tracking-widest text-zinc-500">
                  <div className="border border-zinc-800 p-2">
                    <div className="text-zinc-600">NODE</div>
                    <div className="text-zinc-200 truncate">a3f4-9b2c</div>
                  </div>
                  <div className="border border-zinc-800 p-2">
                    <div className="text-zinc-600">PEERS</div>
                    <div className="text-zinc-200">{peerCount}</div>
                  </div>

                  </div>
                </div>
              </TacticalCorners>

              {/* Mesh status */}
              <section>
                <SectionHeader icon={Radio} label="Mesh Status" />
                <div className="border border-zinc-800 bg-ink-900/60 divide-y divide-zinc-800">
                  <StatusRow icon={Wifi}     label="P2P Transport" value="Nearby · P2P_CLUSTER" status="ok" />
                  <StatusRow icon={Activity} label="Gossip"        value={`${peerCount} peers · ttl 8`}   status="ok" />
                  <StatusRow icon={Box}      label="Database"      value="disaster_mesh.db · 1.2 MB"      status="ok" />
                  <StatusRow icon={Bot}      label="On-device AI"

        function StatusRow({ icon: Icon, label, value, status }) {

            <div className="flex items-center gap-3 p-3">

                <div className="font-mono text-[10px] tracking-widest text-zinc-500 truncate">{value}</div>
              </div>
              <span className="w-2 h-2 rounded-full" style={{ background: color, boxShadow: `0 0 6px ${color}` }} />
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // APP SHELL — reads from global context; only owns UI nav state.
        // The mesh connection and all shared state live in AppProvider
        // above the router, so navigation never kills the connection.
        // ───────────────────────────────────────────────────────────────
        function AppShell() {
          const {
            session, setSession,
            signals, addSignal,
            tasks,
            peerCount,
            battery,
            meshConnected,
            aiState, startDownload, cancelDownload,
          } = useApp();

          // Pure UI state — navigating between tabs does NOT reset these
          const [tab,           setTab]           = useState('home');
          const [aiPanelOpen,   setAiPanelOpen]   = useState(false);
          const [composeOpen,   setComposeOpen]   = useState(false);
          const [openSignalId,  setOpenSignalId]  = useState(null);
          const [openClusterId, setOpenClusterId] = useState(null);

          const changeTab = (t) => { setOpenClusterId(null); setTab(t); };

          const openSignal    = useCallback((id) => setOpenSignalId(id), []);
          const openSignalObj = openSignalId ? signals.find((s) => s.id === openSignalId) : null;

          const submitSignal = ({ message, people }) => {
            const lc = message.toLowerCase();
            const inferredPriority =
              /unconscious|not breathing|drown|severe|bleed|critical|trapped|labour/.test(lc) ? 'CRITICAL' :
              /injur|fever|hurt|fire|water rising|stuck/.test(lc)                              ? 'HIGH'     :
              /food|water|shelter|info/.test(lc)                                               ? 'NORMAL'   : 'HIGH';

            addSignal({
              id:              'sig-' + Math.random().toString(36).slice(2, 8),
              sender_node_id:  'node-self',
              sender_name:     session.name,
              sender_role:     session.role,
              category:        'UNCLASSIFIED',
              priority:        inferredPriority,
              message,
              summary: aiState.status === 'ready'
                ? message.slice(0, 60) + (message.length > 60 ? '…' : '') : null,
              needs:           [],
              people_count:    people ? parseInt(people, 10) : 0,
              area:            'Your Location',
              area_id:         'area-self',
              latitude:        28.6121,
              longitude:       77.2103,
              manual_location: 'Auto-fetched (28.6121° N, 77.2103° E)',
              // Offline? drop into queue — will broadcast on reconnect
              status:          meshConnected ? 'NEW' : 'QUEUED',
              hop_count:       0,
              ttl:             8,
              created_at:      Date.now(),
              updated_at:      Date.now(),
            });
            setComposeOpen(false);
            setTab('home');
          };

          if (!session) return <LoginScreen onContinue={setSession} />;

          const priOrder = { CRITICAL: 0, HIGH: 1, NORMAL: 2, LOW: 3 };

          let body;
          if (tab === 'home') {
            if (session.role === 'CIVILIAN') {
              body = (
                <CivilianDashboard
                  onOpenSOS={() => setComposeOpen(true)}
                  onOpenAssistant={() => {
                    if (aiState.status === 'absent') setAiPanelOpen(true);
                    setTab('assistant');
                  }}
                  onOpenSignal={openSignal}
                  onGoComms={() => changeTab('chat')}
                />
              );
            } else if (session.role === 'VOLUNTEER') {
              body = (
                <VolunteerDashboard
                  session={session}
                  tasks={tasks}
                  signals={signals}
                  onOpenTask={(id) => alert('Task ' + id)}
                  onOpenSignal={openSignal}
                  onGoMap={() => changeTab('map')}
                />
              );
            } else {
              if (openClusterId) {
                const cluster   = MOCK_CLUSTERS.find((c) => c.id === openClusterId);
                const clSignals = cluster
                  ? [...signals.filter((s) => cluster.signal_ids.includes(s.id))]
                      .sort((a, b) => priOrder[a.priority] - priOrder[b.priority])
                  : [];
                const topPriority = clSignals.reduce((best, s) =>
                  priOrder[s.priority] < priOrder[best] ? s.priority : best, 'LOW');
                const totalPeople = clSignals.reduce((n, s) => n + (s.people_count || 0), 0);
                const unresolved  = clSignals.filter((s) => s.status !== 'RESOLVED').length;
                body = (
                  <ZoneDashboard
                    cluster={{ ...cluster, clSignals, topPriority, totalPeople, unresolved }}
                    signals={clSignals}
                    onBack={() => setOpenClusterId(null)}
                    onOpenSignal={openSignal}
                    aiState={aiState}
                  />
                );
              } else {
                body = (
                  <AuthorityDashboard
                    session={session}
                    signals={signals}
                    onOpenCluster={setOpenClusterId}
                  />
                );
              }
            }
          } else if (tab === 'map') {
            body = <MapScreen session={session} onOpenSignal={openSignal} />;
          } else if (tab === 'chat') {
            body = <ChatScreen />;
          } else if (tab === 'assistant') {
            body = (
              <AssistantScreen
                aiState={aiState}
                session={session}
                onDownload={() => { setAiPanelOpen(true); startDownload(); }}
              />
            );
          } else if (tab === 'profile') {
            body = (
              <ProfileScreen
                session={session}
                peerCount={peerCount}
                battery={battery}
                aiState={aiState}
                onLogout={() => setSession(null)}
                onSwitchRole={() => setSession(null)}
              />
            );
          }

          return (
            <div className="min-h-screen bg-ink-950 text-zinc-100 max-w-md mx-auto relative shadow-2xl border-x border-zinc-900 sm:my-3">
              <TopBar
                session={session}
                peerCount={peerCount}
                battery={battery}
                aiState={aiState}
                onOpenAiPanel={() => setAiPanelOpen(true)}
                onOpenSettings={() => changeTab('profile')}
              />

              <main className="min-h-[calc(100vh-3rem-3rem)]">{body}</main>

              <BottomNav active={tab} onChange={changeTab} role={session.role} />

              {/* FAB — civilian SOS shortcut */}
              {session.role === 'CIVILIAN' && tab === 'home' && (
                <button
                  onClick={() => setComposeOpen(true)}
                  className="fixed bottom-20 right-4 sm:right-[max(1rem,calc(50%-13rem))] z-20 w-14 h-14 flex items-center justify-center rounded-full"
                  style={{
                    background: '#FF4D4D',
                    boxShadow: '0 0 24px rgba(255,77,77,0.5), 0 4px 12px rgba(0,0,0,0.4)',
                  }}
                >
                  <Siren size={22} className="text-white" strokeWidth={2.4} />
                </button>
              )}

              <GemmaPanel
                open={aiPanelOpen}
                onClose={() => setAiPanelOpen(false)}
                aiState={aiState}
                onDownload={startDownload}
                onCancel={cancelDownload}
                onRetry={startDownload}
                isPrimary={session.role === 'CIVILIAN'}
              />

              {openSignalObj && (
                <SignalDetail
                  signal={openSignalObj}
                  role={session.role}
                  onClose={() => setOpenSignalId(null)}
                />
              )}

              {composeOpen && (
                <ComposeSheet
                  onClose={() => setComposeOpen(false)}
                  onSubmit={submitSignal}
                />
              )}
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // ROOT APP — AppProvider wraps the shell so state outlives tabs
        // ───────────────────────────────────────────────────────────────
        function App() {
          return (
            <AppProvider>
              <AppShell />
            </AppProvider>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      });
    </script>
  </body>
</html>
