                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <CategoryChip category={signal.category} />
                    <StatusPill status={signal.status} />
                    <span className="ml-auto font-mono text-[10px] text-zinc-500 tracking-widest">
                      {timeAgo(signal.created_at)}
                    </span>
                  </div>
                  <p className="text-[13px] text-zinc-200 leading-snug line-clamp-2">
                    {signal.summary || signal.message}
                  </p>
                  {!compact && (
                    <div className="mt-2 flex items-center gap-3 font-mono text-[10px] tracking-widest text-zinc-500">
                      {signal.manual_location && (
                        <span className="flex items-center gap-1">
                          <MapPin size={10} /> {signal.manual_location}
                        </span>
                      )}
                      {signal.people_count > 0 && (
                        <span className="flex items-center gap-1">
                          <Users size={10} /> {signal.people_count}
                        </span>
                      )}
                      <PriorityDot priority={signal.priority} />
                      <span style={{ color: pri.color }}>{pri.label}</span>
                      <span className="ml-auto"><HopBadge hop={signal.hop_count} ttl={signal.ttl} /></span>
                    </div>
                  )}
                </div>
              </div>
            </button>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // VOLUNTEER DASHBOARD
        // ───────────────────────────────────────────────────────────────
        function VolunteerDashboard({ session, tasks, signals, onOpenTask, onOpenSignal, onGoMap }) {
          const active = tasks.filter((t) => t.status !== 'DONE' && t.status !== 'CANCELLED');
          const nearby = signals.filter((s) => s.status !== 'RESOLVED').slice(0, 4);

          return (
            <div className="px-3 pt-3 pb-28 space-y-5">
              <div className="px-1">
                <p className="font-mono text-[10px] tracking-widest text-zinc-500 mb-1">
                  VOLUNTEER · FIELD
                </p>
                <h1 className="text-xl font-bold text-zinc-100">{session.name.split(' ')[0]}, you have {active.length} tasks.</h1>
                <p className="text-[13px] text-zinc-500 mt-1">
                  Tap a task to update status. Your location is shared with assigning authority only.
                </p>
              </div>

              {/* Stat strip */}
              <div className="grid grid-cols-3 gap-2">
                <StatTile icon={ClipboardList} label="Active Tasks"  value={active.length} accent="#3FB950" />
                <StatTile icon={Radar}        label="Nearby Signals" value={nearby.length}  accent="#58A6FF" />
                <StatTile icon={CheckCircle2} label="Resolved Today" value={4}              accent="#a1a1aa" />
              </div>

              {/* Tasks */}
              <section>
                <SectionHeader icon={ClipboardList} label="Assigned Tasks" count={active.length} />
                <div className="space-y-2">
                  {active.map((t) => (
                    <TaskCard key={t.id} task={t} onClick={() => onOpenTask(t.id)} />
                  ))}
                </div>
              </section>

              {/* Mini radar / nearby */}
              <section>
                <SectionHeader
                  icon={Radar}
                  label="Nearby Distress"
                  suffix={
                    <button
                      onClick={onGoMap}
                      className="font-mono text-[10px] tracking-widest text-civilian hover:underline flex items-center gap-1"
                    >
                      MAP <ChevronRight size={11} />
                    </button>
                  }
                />
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <RadarPreview />
                  <div className="space-y-1.5">
                    {nearby.slice(0, 3).map((s) => (
                      <button
                        key={s.id}
                        onClick={() => onOpenSignal(s.id)}
                        className="w-full text-left p-2 border border-zinc-800 hover:border-zinc-700 bg-ink-900/60 flex items-center gap-2"
                      >
                        <PriorityDot priority={s.priority} />
                        <span className="text-[12px] text-zinc-200 truncate flex-1">{s.summary || s.message}</span>
                        <span className="font-mono text-[10px] text-zinc-500">{timeAgo(s.created_at)}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </section>

              {/* Field Inventory */}
              <section>
                <SectionHeader icon={Box} label="Field Inventory" />
                <InventoryPanel canEdit />
              </section>
            </div>
          );
        }

        function StatTile({ icon: Icon, label, value, accent }) {
          return (
            <div className="border border-zinc-800 bg-ink-900/60 p-3">
              <div className="flex items-center justify-between mb-2">
                <Icon size={14} style={{ color: accent }} strokeWidth={2.2} />
                <span className="font-mono text-[9px] tracking-widest text-zinc-600">VAL</span>
              </div>
              <div className="text-2xl font-bold leading-none" style={{ color: accent }}>
                {value}
              </div>
              <div className="mt-1 font-mono text-[10px] tracking-widest text-zinc-500 uppercase">
                {label}
              </div>
            </div>
          );
        }

        function TaskCard({ task, onClick }) {
          const cat = CATEGORY_META[task.category] || CATEGORY_META.INFO;
          const Icon = cat.icon;
          const statusColor = {
            ASSIGNED: '#FFD43B',
            ACCEPTED: '#58A6FF',
            EN_ROUTE: '#FFA033',
            DONE: '#3FB950',
            CANCELLED: '#71717a',
          }[task.status] || '#a1a1aa';

          return (
            <button
              onClick={onClick}
              className="w-full text-left bg-ink-900/70 border border-zinc-800 hover:border-zinc-700 transition p-3"
            >
              <div className="flex items-start gap-3">
                <div
                  className="w-9 h-9 shrink-0 flex items-center justify-center rounded-sm"
                  style={{ background: cat.color + '14', border: `1px solid ${cat.color}44`, color: cat.color }}
                >
                  <Icon size={16} strokeWidth={2.2} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <CategoryChip category={task.category} />
                    <span
                      className="font-mono text-[10px] tracking-widest px-1.5 py-0.5 border rounded-sm"
                      style={{ color: statusColor, borderColor: statusColor + '55' }}
                    >
                      {task.status}
                    </span>
                    <span className="ml-auto font-mono text-[10px] text-zinc-500 tracking-widest">
                      {timeAgo(task.created_at)}
                    </span>
                  </div>
                  <p className="text-[13px] text-zinc-100 leading-snug font-medium">
                    {task.title}
                  </p>
                  <p className="text-[12px] text-zinc-500 mt-0.5 leading-snug line-clamp-2">
                    {task.description}
                  </p>
                </div>
                <ChevronRight size={16} className="text-zinc-600 mt-1" />
              </div>
            </button>
          );
        }

        function RadarPreview() {
          return (
            <div className="relative aspect-square bg-ink-900/60 border border-zinc-800 overflow-hidden">
              {/* Concentric rings */}
              {[1, 2, 3].map((r) => (
                <span
                  key={r}
                  className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full border border-volunteer/30"
                  style={{ width: `${r * 30}%`, height: `${r * 30}%` }}
                />
              ))}
              <span className="absolute left-0 right-0 top-1/2 h-px bg-volunteer/20" />
              <span className="absolute top-0 bottom-0 left-1/2 w-px bg-volunteer/20" />

              {/* Sweep */}
              <span
                className="absolute left-1/2 top-1/2 origin-top-left animate-radar"
                style={{
                  width: '50%', height: '50%',
                  background: 'conic-gradient(from 0deg, rgba(63,185,80,0.35), transparent 70deg)',
                  transformOrigin: '0 0',
                }}
              />

              {/* Pings */}
              {[
                { x: 64, y: 38, c: '#FF4D4D' },
                { x: 30, y: 60, c: '#FFA033' },
                { x: 70, y: 70, c: '#FFD43B' },
                { x: 48, y: 28, c: '#58A6FF' },
              ].map((p, i) => (
                <span
                  key={i}
                  className="absolute w-2 h-2 rounded-full animate-pulse"
                  style={{
                    left: `${p.x}%`, top: `${p.y}%`,
                    background: p.c,
                    boxShadow: `0 0 8px ${p.c}`,
                  }}
                />
              ))}

              <div className="absolute top-2 left-2 font-mono text-[9px] tracking-widest text-volunteer/70">
                RADAR · 250 m
              </div>
              <div className="absolute bottom-2 right-2 font-mono text-[9px] tracking-widest text-zinc-500">
                14 PINGS
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // AUTHORITY DASHBOARD — location-clustered zone cards
        // ───────────────────────────────────────────────────────────────
        function AuthorityDashboard({ session, signals, onOpenCluster }) {
          const [inventoryOpen, setInventoryOpen] = useState(false);
          const counts = useMemo(() => ({
            total: signals.length,
            critical: signals.filter((s) => s.priority === 'CRITICAL' && s.status !== 'RESOLVED').length,
            inProgress: signals.filter((s) => s.status === 'IN_PROGRESS' || s.status === 'ACKNOWLEDGED').length,
            resolved: signals.filter((s) => s.status === 'RESOLVED').length,
          }), [signals]);

          // Enrich clusters with live signal objects.
          const clusters = useMemo(() =>
            MOCK_CLUSTERS.map((c) => {
              const clSignals = signals.filter((s) => c.signal_ids.includes(s.id));
              const priOrder = { CRITICAL: 0, HIGH: 1, NORMAL: 2, LOW: 3 };
              const topPriority = clSignals.reduce((best, s) =>
                (priOrder[s.priority] < priOrder[best]) ? s.priority : best, 'LOW');
              const totalPeople = clSignals.reduce((n, s) => n + (s.people_count || 0), 0);
              const unresolved = clSignals.filter((s) => s.status !== 'RESOLVED').length;
              return { ...c, clSignals, topPriority, totalPeople, unresolved };
            }), [signals]);

          return (
            <div className="px-3 pt-3 pb-28 space-y-5">
              <div className="px-1">
                <p className="font-mono text-[10px] tracking-widest text-zinc-500 mb-1">
                  AUTHORITY · COMMAND
                </p>
                <h1 className="text-xl font-bold text-zinc-100">Command Overview</h1>
                <p className="text-[13px] text-zinc-500 mt-1">
                  {counts.critical} critical · {clusters.length} active zones
                </p>
              </div>

              {/* Stat grid */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <StatTile icon={Radio}        label="Total Signals" value={counts.total}      accent="#a1a1aa" />
                <StatTile icon={Siren}        label="Critical"      value={counts.critical}   accent="#FF4D4D" />
                <StatTile icon={Activity}     label="In Progress"   value={counts.inProgress} accent="#58A6FF" />
                <StatTile icon={CheckCircle2} label="Resolved"      value={counts.resolved}   accent="#3FB950" />
              </div>

              {/* Quick actions */}
              <section>
                <SectionHeader icon={Zap} label="Quick Actions" />
                <div className="grid grid-cols-3 gap-2">
                  <QuickActionTile icon={Shield}        label="Safe Zone"      sub="Designate"  accent="#F78166" />
                  <QuickActionTile icon={ClipboardList} label="Resource Plan"  sub="Generate"   accent="#FFD43B" />
                  <QuickActionTile icon={Send}          label="Broadcast"      sub="All Roles"  accent="#58A6FF" />
                </div>
              </section>

              {/* Inventory */}
              <section>
                <SectionHeader
                  icon={Box}
                  label="Inventory"
                  suffix={
                    <button
                      onClick={() => setInventoryOpen((p) => !p)}
                      className="font-mono text-[10px] tracking-widest text-zinc-400 border border-zinc-700 px-2 py-0.5 hover:border-zinc-500"
                    >
                      {inventoryOpen ? 'HIDE' : 'MANAGE'}
                    </button>
                  }
                />
                {inventoryOpen && <InventoryPanel canEdit />}
              </section>

              {/* Location zone clusters */}
              <section>
                <SectionHeader
                  icon={MapPin}
                  label="Signal Zones"
                  count={clusters.length}
                  suffix={
                    <span className="font-mono text-[10px] tracking-widest text-zinc-600">
                      GROUPED BY AREA
                    </span>
                  }
                />
                <div className="space-y-3">
                  {clusters.map((c) => (
                    <ClusterCard
                      key={c.id}
                      cluster={c}
                      onOpen={() => onOpenCluster(c.id)}
                    />
                  ))}
                </div>
              </section>
            </div>
          );
        }

        function QuickActionTile({ icon: Icon, label, sub, accent }) {
          return (
            <button
              className="flex flex-col items-start p-3 border bg-ink-900/60 active:scale-[0.97] transition text-left"
              style={{ borderColor: accent + '55' }}
            >
              <div
                className="w-9 h-9 mb-2 flex items-center justify-center rounded-sm"
                style={{ background: accent + '18', border: `1px solid ${accent}55`, color: accent }}
              >
                <Icon size={16} strokeWidth={2.2} />
              </div>
              <span className="text-[12px] font-medium text-zinc-100">{label}</span>
              <span className="font-mono text-[10px] tracking-widest text-zinc-500 mt-0.5">{sub}</span>
            </button>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // CLUSTER CARD (authority zone card)
        // ───────────────────────────────────────────────────────────────
        function ClusterCard({ cluster, onOpen }) {
          const { label, sublabel, radius_m, clSignals, topPriority, totalPeople, unresolved } = cluster;
          const priMeta = PRIORITY_META[topPriority];
          const [gemmaOpen, setGemmaOpen] = useState(false);
          const [gemmaLoading, setGemmaLoading] = useState(false);
          const [gemmaResult, setGemmaResult] = useState(null);

          // Aggregate category counts
          const catCounts = clSignals.reduce((acc, s) => {
            acc[s.category] = (acc[s.category] || 0) + 1;
            return acc;
          }, {});

          const triggerGemma = (e) => {
            e.stopPropagation();
            setGemmaOpen(true);
            if (gemmaResult) return;
            setGemmaLoading(true);
            setTimeout(() => {
              setGemmaLoading(false);
              setGemmaResult({
                sitrep: `${unresolved} unresolved signal${unresolved !== 1 ? 's' : ''} within ${radius_m}m. Dominant need: ${Object.keys(catCounts)[0]}.`,
                recommendation: clSignals.map((s) =>
                  `• ${s.priority} — ${s.summary || s.message.slice(0, 55)}${s.message.length > 55 ? '…' : ''}`
                ).join('\n'),
                action: `Mark ${unresolved} ticket${unresolved !== 1 ? 's' : ''} as Acknowledged and assign closest volunteer unit.`,
              });
            }, 1400);
          };

          return (
            <div
              className="bg-ink-900/70 border border-zinc-800 overflow-hidden"
              style={{ borderLeftColor: priMeta.color, borderLeftWidth: 3 }}
            >
              {/* Header row */}
              <div className="flex items-start gap-3 p-3">
                <div
                  className="w-10 h-10 shrink-0 flex items-center justify-center rounded-sm mt-0.5"
                  style={{ background: priMeta.color + '14', border: `1px solid ${priMeta.color}44`, color: priMeta.color }}
                >
                  <MapPin size={16} strokeWidth={2.2} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-[14px] text-zinc-100 font-semibold leading-tight">{label}</div>
                  <div className="font-mono text-[10px] tracking-widest text-zinc-500 mt-0.5">{sublabel}</div>
                  {/* Category chips */}
                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {Object.entries(catCounts).map(([cat, n]) => {
                      const m = CATEGORY_META[cat];
                      const I = m.icon;
                      return (
                        <span
                          key={cat}
                          className="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-mono tracking-widest"
                          style={{ color: m.color, background: m.color + '14', border: `1px solid ${m.color}33` }}
                        >
                          <I size={10} strokeWidth={2.4} /> {n} {cat}
                        </span>
                      );
                    })}
                  </div>
                </div>
                {/* Signal count badge */}
                <div className="text-right shrink-0">
                  <div className="font-mono text-xl font-bold leading-none" style={{ color: priMeta.color }}>
                    {unresolved}
                  </div>
                  <div className="font-mono text-[9px] tracking-widest text-zinc-500 mt-0.5">OPEN</div>
                </div>
              </div>

              {/* Aggregate stats strip */}
              <div className="flex items-center gap-4 px-3 pb-2 font-mono text-[10px] tracking-widest text-zinc-500">
                <span className="flex items-center gap-1">
                  <Users size={10} /> {totalPeople} ppl
                </span>
                <span className="flex items-center gap-1">
                  <Radio size={10} /> {clSignals.length} signal{clSignals.length !== 1 ? 's' : ''}
                </span>
                <span style={{ color: priMeta.color }} className="flex items-center gap-1">
                  <PriorityDot priority={topPriority} /> {priMeta.label}
                </span>
              </div>

              {/* Gemma result inline */}
              {gemmaOpen && (
                <div
                  className="mx-3 mb-3 border p-3 bg-ink-950/60"
                  style={{ borderColor: '#58A6FF44' }}
                >
                  <div className="flex items-center gap-2 mb-2">
                    <Bot size={12} className="text-civilian" />
                    <span className="font-mono text-[10px] tracking-widest text-civilian">GEMMA ZONE SITREP</span>
                    <button onClick={() => setGemmaOpen(false)} className="ml-auto text-zinc-500 hover:text-zinc-200">
                      <X size={12} />
                    </button>
                  </div>
                  {gemmaLoading ? (
                    <div className="flex items-center gap-2 font-mono text-[11px] text-zinc-400 py-2">
                      <Loader2 size={13} className="animate-spin text-civilian" />
                      Analysing {clSignals.length} signals…
                    </div>
                  ) : gemmaResult && (
                    <>
                      <p className="text-[12px] text-zinc-200 leading-relaxed mb-2">{gemmaResult.sitrep}</p>
                      <pre className="font-mono text-[11px] text-zinc-400 whitespace-pre-wrap leading-relaxed mb-3">
                        {gemmaResult.recommendation}
                      </pre>
                      <div className="border border-volunteer/40 bg-volunteer/[0.07] p-2 font-mono text-[11px] text-volunteer/90 mb-3">
                        ⟶ {gemmaResult.action}
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => setGemmaOpen(false)}
                          className="py-2 border border-volunteer text-volunteer font-mono text-[10px] tracking-widest hover:bg-volunteer/15 transition"
                        >
                          ACCEPT ALL
                        </button>
                        <button
                          onClick={() => { setGemmaOpen(false); onOpen(); }}
                          className="py-2 border border-zinc-700 text-zinc-300 font-mono text-[10px] tracking-widest hover:bg-zinc-800 transition"
                        >
                          REVIEW EACH
                        </button>
                      </div>
                    </>
                  )}
                </div>
              )}

              {/* Action row */}
              <div className="grid grid-cols-2 border-t border-zinc-800 divide-x divide-zinc-800">
                <button
                  onClick={triggerGemma}
                  className="flex items-center justify-center gap-1.5 py-2.5 font-mono text-[10px] tracking-widest text-civilian hover:bg-civilian/10 transition"
                >
                  <Sparkles size={11} strokeWidth={2.4} />
                  RESOLVE VIA GEMMA
                </button>
                <button
                  onClick={onOpen}
                  className="flex items-center justify-center gap-1.5 py-2.5 font-mono text-[10px] tracking-widest text-authority hover:bg-authority/10 transition"
                >
                  OPEN ZONE <ChevronRight size={11} />
                </button>
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // ZONE DASHBOARD (authority drills into a cluster)
        // ───────────────────────────────────────────────────────────────
        function ZoneDashboard({ cluster, signals, onBack, onOpenSignal, aiState }) {
          const { label, sublabel, topPriority, totalPeople, unresolved } = cluster;
          const priMeta = PRIORITY_META[topPriority];
          const [gemmaAnalysing, setGemmaAnalysing] = useState(false);
          const [gemmaResult, setGemmaResult] = useState(null);

          const runGemma = () => {
            if (gemmaResult || gemmaAnalysing) return;
            setGemmaAnalysing(true);
            setTimeout(() => {
              setGemmaAnalysing(false);
              setGemmaResult({
                sitrep: `${unresolved} open signal${unresolved !== 1 ? 's' : ''} across ${label}. ${totalPeople} people at risk.`,
                plan: signals.map((s, i) =>
                  `${i + 1}. [${s.priority}] ${s.summary || s.message.slice(0, 60)}${s.message.length > 60 ? '…' : ''}`
                ).join('\n'),
                action: 'Recommend dispatching paramedic unit to highest-priority location first, then routing supply volunteer to secondary sites.',
              });
            }, 1800);
          };

          return (
            <div className="pb-28">
              {/* In-screen App bar for sub-screen */}
              <div className="sticky top-0 z-10 bg-ink-950/95 backdrop-blur border-b border-zinc-900 flex items-center gap-2 px-3 py-3">
                <button onClick={onBack} className="p-1 -ml-1 text-zinc-400 hover:text-zinc-100">
                  <ArrowLeft size={16} />
                </button>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold text-zinc-100 truncate">{label}</div>
                  <div className="font-mono text-[9px] tracking-widest text-zinc-500">{sublabel}</div>
                </div>
                <span
                  className="font-mono text-[10px] tracking-widest px-1.5 py-0.5 border"
                  style={{ color: priMeta.color, borderColor: priMeta.color + '55' }}
                >
                  {priMeta.label}
                </span>
              </div>

              <div className="px-3 pt-4 space-y-4">
                {/* Zone stat strip */}
                <div className="grid grid-cols-3 gap-2">
                  <StatTile icon={Radio}        label="Total"    value={signals.length}  accent="#a1a1aa" />
                  <StatTile icon={Siren}        label="Open"     value={unresolved}       accent={priMeta.color} />
                  <StatTile icon={Users}        label="Affected" value={totalPeople || '—'} accent="#58A6FF" />
                </div>

                {/* Gemma batch resolve */}
                <div className="border border-civilian/40 bg-civilian/[0.05] overflow-hidden">
                  <button
                    onClick={runGemma}
                    disabled={!!gemmaResult || gemmaAnalysing}
                    className="w-full flex items-center gap-3 p-3.5 hover:bg-civilian/[0.08] transition disabled:opacity-80"
                  >
                    <div className="w-10 h-10 flex items-center justify-center bg-civilian/15 border border-civilian/60 text-civilian shrink-0">
                      {gemmaAnalysing
                        ? <Loader2 size={18} className="animate-spin" strokeWidth={2.2} />
                        : <Sparkles size={18} strokeWidth={2.2} />
                      }
                    </div>
                    <div className="flex-1 text-left">
                      <div className="text-sm font-medium text-zinc-100">
                        {gemmaResult ? 'Gemma Analysis' : 'Resolve All via Gemma'}
                      </div>
                      <p className="text-[12px] text-zinc-400 mt-0.5">
                        {gemmaAnalysing
                          ? 'Gemma is analysing this zone…'
                          : gemmaResult
                            ? 'Tap to review the SITREP'
                            : `Batch analyse ${signals.length} signals, generate action plan`
                        }
                      </p>
                    </div>
                    {!gemmaAnalysing && !gemmaResult && (
                      <ChevronRight size={14} className="text-civilian/60 shrink-0" />
                    )}
                  </button>

                  {/* Gemma output */}
                  {gemmaResult && (
                    <div className="border-t border-civilian/30 p-3.5 space-y-3">
                      <p className="text-[13px] text-zinc-200 leading-relaxed">{gemmaResult.sitrep}</p>
                      <pre className="font-mono text-[11px] text-zinc-400 whitespace-pre-wrap leading-relaxed bg-ink-950/60 p-2 border border-zinc-800">
                        {gemmaResult.plan}
                      </pre>
                      <div className="border border-volunteer/40 bg-volunteer/[0.07] p-2.5 font-mono text-[11px] text-volunteer/90">
                        ⟶ {gemmaResult.action}
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button className="py-2.5 border border-volunteer text-volunteer font-mono text-[10px] tracking-widest hover:bg-volunteer/15 transition">
                          ACCEPT PLAN
                        </button>
                        <button className="py-2.5 border border-zinc-700 text-zinc-300 font-mono text-[10px] tracking-widest hover:bg-zinc-800 transition">
                          EDIT PLAN
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* Individual tickets */}
                <section>
                  <SectionHeader icon={Siren} label="Zone Tickets" count={signals.length} />
                  <div className="space-y-2">
                    {signals.map((s) => (
                      <ZoneTicketCard key={s.id} signal={s} onOpen={() => onOpenSignal(s.id)} />
                    ))}
                  </div>
                </section>
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // INVENTORY PANEL — shared read/write view for Auth + Vol
        // ───────────────────────────────────────────────────────────────
        function InventoryPanel({ canEdit }) {
          const { inventory, adjustInventory } = useApp();
          return (
            <div className="border border-zinc-800 bg-ink-900/60 divide-y divide-zinc-800">
              {Object.entries(inventory).map(([key, item]) => (
                <div key={key} className="flex items-center gap-3 px-3 py-2.5">
                  <Package size={13} className="text-zinc-500 shrink-0" strokeWidth={2.2} />
                  <div className="flex-1 min-w-0">
                    <div className="text-[13px] text-zinc-200">{item.label}</div>
                    <div className="font-mono text-[9px] tracking-widest text-zinc-500">
                      {item.unit}
                    </div>
                  </div>
                  {item.count <= 5 && (
                    <span className="font-mono text-[9px] tracking-widest text-critical border border-critical/40 px-1.5 py-0.5">
                      LOW
                    </span>
                  )}
                  {canEdit ? (
                    <div className="flex items-center gap-1 shrink-0">
                      <button
                        onClick={() => adjustInventory(key, -1)}
                        disabled={item.count === 0}
                        className="w-7 h-7 flex items-center justify-center border border-zinc-700 text-zinc-400 hover:border-critical/60 hover:text-critical disabled:opacity-25 transition"
                      >
                        <MinusCircle size={13} strokeWidth={2.2} />
                      </button>
                      <span className="font-mono text-sm font-bold text-zinc-100 w-8 text-center">
                        {item.count}
                      </span>
                      <button
                        onClick={() => adjustInventory(key, +1)}
                        className="w-7 h-7 flex items-center justify-center border border-zinc-700 text-zinc-400 hover:border-volunteer/60 hover:text-volunteer transition"
                      >
                        <Plus size={13} strokeWidth={2.2} />
                      </button>
                    </div>
                  ) : (
                    <span className="font-mono text-lg font-bold text-zinc-100 shrink-0">
                      {item.count}
                    </span>
                  )}
                </div>
              ))}
              {canEdit && (
                <div className="px-3 py-2 flex items-center gap-1.5 font-mono text-[9px] tracking-widest text-zinc-600">
                  <MapPin size={9} /> ADJUSTMENTS TAGGED · 28.6121° N · 77.2103° E
                </div>
              )}
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // ASSIGN TICKET MODAL — authority picks volunteer + allocates stock
        // ───────────────────────────────────────────────────────────────
        function AssignTicketModal({ signal, onClose, onAssign }) {
          const { inventory } = useApp();
          const [selectedVol, setSelectedVol] = useState(null);
          const [allocations, setAllocations] = useState({});

          const setAlloc = (key, val) => {
            const n = parseInt(val, 10) || 0;
            if (n <= 0) {
              setAllocations((p) => { const { [key]: _, ...rest } = p; return rest; });
            } else {
              setAllocations((p) => ({ ...p, [key]: Math.min(n, inventory[key]?.count ?? 0) }));
            }
          };

          const overAllocated = Object.entries(allocations).some(
            ([k, v]) => inventory[k] && v > inventory[k].count
          );

          return (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center p-0 sm:p-4"
              onClick={onClose}>
              <div className="w-full sm:max-w-md bg-ink-900 border-t sm:border border-zinc-800 max-h-[92vh] overflow-y-auto"
                onClick={(e) => e.stopPropagation()}>

                <div className="sticky top-0 bg-ink-900/95 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center gap-2">
                  <button onClick={onClose} className="-m-1 p-1 text-zinc-400 hover:text-zinc-100">
                    <X size={16} />
                  </button>
                  <span className="font-mono text-[10px] tracking-widest text-zinc-500">
                    ASSIGN TICKET · {signal.id.toUpperCase()}
                  </span>
                </div>

                <div className="p-4 space-y-5">
                  {/* Signal summary */}
                  <div className="border border-zinc-800 p-3">
                    <div className="flex items-center gap-2 mb-1.5">
                      <CategoryChip category={signal.category} />
                      <StatusPill status={signal.status} />
                    </div>
                    <p className="text-[13px] text-zinc-200 leading-snug">{signal.summary || signal.message}</p>
                    {signal.manual_location && (
                      <div className="mt-1 font-mono text-[10px] text-zinc-500 flex items-center gap-1">
                        <MapPin size={10} /> {signal.manual_location}
                      </div>
                    )}
                  </div>

                  {/* Select volunteer */}
                  <div>
                    <div className="font-mono text-[10px] tracking-widest text-zinc-500 mb-2">
                      SELECT VOLUNTEER
                    </div>
                    <div className="space-y-1.5">
                      {MOCK_VOLUNTEERS.map((v) => {
                        const selected = selectedVol?.id === v.id;
                        return (
                          <button
                            key={v.id}
                            onClick={() => setSelectedVol(v)}
                            className="w-full text-left flex items-center gap-3 p-2.5 border transition"
                            style={selected
                              ? { borderColor: '#3FB950', background: '#3FB95012' }
                              : { borderColor: '#27272a' }}
                          >
                            <div
                              className="w-8 h-8 flex items-center justify-center shrink-0"
                              style={{ background: '#3FB95015', border: '1px solid #3FB95044', color: '#3FB950' }}
                            >
                              <LifeBuoy size={14} strokeWidth={2.2} />
                            </div>
                            <div className="flex-1">
                              <div className="text-[13px] text-zinc-100 font-medium">{v.name}</div>
                              <div className="font-mono text-[10px] tracking-widest"
                                style={{ color: v.status === 'AVAILABLE' ? '#3FB950' : '#FFA033' }}>
                                {v.status}
                              </div>
                            </div>
                            {selected && <CheckCircle2 size={14} className="text-volunteer shrink-0" />}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Inventory allocation */}
                  <div>
                    <div className="font-mono text-[10px] tracking-widest text-zinc-500 mb-2">
                      ALLOCATE INVENTORY <span className="text-zinc-600 normal-case">(optional)</span>
                    </div>
                    <div className="border border-zinc-800 divide-y divide-zinc-800">
                      {Object.entries(inventory).map(([key, item]) => (
                        <div key={key} className="flex items-center gap-3 px-3 py-2">
                          <div className="flex-1 min-w-0">
                            <div className="text-[12px] text-zinc-200">{item.label}</div>
                            <div className="font-mono text-[9px] tracking-widest text-zinc-500">
                              {item.count} {item.unit} available
                            </div>
                          </div>
                          <input
                            type="number"
                            min={0}
                            max={item.count}
                            value={allocations[key] ?? ''}
                            onChange={(e) => setAlloc(key, e.target.value)}
                            placeholder="0"
                            className="w-16 bg-ink-950 border border-zinc-700 focus:border-civilian/60 outline-none px-2 py-1.5 text-sm text-zinc-100 text-center font-mono"
                          />
                        </div>
                      ))}
                    </div>
                    {overAllocated && (
                      <p className="mt-1.5 font-mono text-[10px] tracking-widest text-critical">
                        QUANTITY EXCEEDS AVAILABLE STOCK
                      </p>
                    )}
                  </div>

                  {/* GPS tag */}
                  <div className="flex items-center gap-1.5 font-mono text-[9px] tracking-widest text-zinc-600">
                    <MapPin size={9} />
                    ALLOCATION TAGGED · 28.6121° N · 77.2103° E · {new Date().toLocaleTimeString()}
                  </div>

                  {/* Actions */}
                  <div className="flex gap-2">
                    <button
                      onClick={onClose}
                      className="flex-1 py-3 border border-zinc-800 text-zinc-300 font-mono text-[11px] tracking-widest hover:bg-ink-800 transition"
                    >
                      CANCEL
                    </button>
                    <button
                      onClick={() => selectedVol && !overAllocated && onAssign(selectedVol, allocations)}
                      disabled={!selectedVol || overAllocated}
                      className="flex-[2] py-3 font-mono text-[11px] tracking-widest border transition disabled:opacity-40 flex items-center justify-center gap-2"
                      style={{ borderColor: '#3FB950', background: '#3FB95015', color: '#3FB950' }}
                    >
                      <CheckCircle2 size={13} strokeWidth={2.4} />
                      APPROVE ASSIGNMENT
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // RESOLVE TICKET MODAL — summary before confirming; allows refund
        // ───────────────────────────────────────────────────────────────
        function ResolveTicketModal({ signal, onClose, onResolve, onUnresolvable }) {
          const { inventory } = useApp();
          const alloc        = signal.inventory_allocated || {};
          const hasAlloc     = Object.keys(alloc).length > 0;

          return (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-end sm:items-center justify-center p-0 sm:p-4"
              onClick={onClose}>
              <div className="w-full sm:max-w-md bg-ink-900 border-t sm:border border-zinc-800 max-h-[92vh] overflow-y-auto"
                onClick={(e) => e.stopPropagation()}>

                <div className="sticky top-0 bg-ink-900/95 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center gap-2">
                  <button onClick={onClose} className="-m-1 p-1 text-zinc-400 hover:text-zinc-100">
                    <X size={16} />
                  </button>
                  <span className="font-mono text-[10px] tracking-widest text-zinc-500">
                    RESOLVE SUMMARY
                  </span>
                </div>

                <div className="p-4 space-y-4">
                  {/* Signal being resolved */}
                  <div>
                    <div className="font-mono text-[10px] tracking-widest text-zinc-600 mb-1.5">SIGNAL</div>
                    <div className="border border-zinc-800 p-3">
                      <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                        <CategoryChip category={signal.category} />
                        <PriorityDot priority={signal.priority} />
                        <span className="font-mono text-[10px] tracking-widest"
                          style={{ color: (PRIORITY_META[signal.priority] || PRIORITY_META.NORMAL).color }}>
                          {signal.priority}
                        </span>
                      </div>
                      <p className="text-[13px] text-zinc-200 leading-snug">{signal.summary || signal.message}</p>
                      {signal.manual_location && (
                        <div className="mt-1 font-mono text-[10px] text-zinc-500 flex items-center gap-1">
                          <MapPin size={10} /> {signal.manual_location}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Assigned volunteer */}
                  {signal.assigned_to_name && (
                    <div className="border border-volunteer/30 bg-volunteer/[0.05] p-3 flex items-center gap-3">
                      <div className="w-9 h-9 flex items-center justify-center shrink-0"
                        style={{ background: '#3FB95015', border: '1px solid #3FB95044', color: '#3FB950' }}>
                        <LifeBuoy size={16} strokeWidth={2.2} />
                      </div>
                      <div>
                        <div className="font-mono text-[9px] tracking-widest text-zinc-500">ASSIGNED VOLUNTEER</div>
                        <div className="text-[13px] text-zinc-100 font-medium mt-0.5">{signal.assigned_to_name}</div>
                      </div>
                    </div>
                  )}

                  {/* Inventory consumed */}
                  {hasAlloc ? (
                    <div>
                      <div className="font-mono text-[10px] tracking-widest text-zinc-600 mb-1.5">INVENTORY CONSUMED</div>
                      <div className="border border-zinc-800 divide-y divide-zinc-800">
                        {Object.entries(alloc).map(([key, qty]) => {
                          const item = inventory[key];
                          if (!item || qty === 0) return null;
                          return (
                            <div key={key} className="flex items-center justify-between px-3 py-2.5">
                              <div className="text-[13px] text-zinc-200">{item.label}</div>
                              <div className="font-mono text-sm font-bold text-critical">
                                −{qty} <span className="font-normal text-zinc-500 text-[10px]">{item.unit}</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ) : (
                    <div className="border border-dashed border-zinc-800 p-3 text-center font-mono text-[10px] tracking-widest text-zinc-600">
                      NO INVENTORY ALLOCATED
                    </div>
                  )}

                  {/* Actions */}
                  <div className="space-y-2 pt-1">
                    <button
                      onClick={onResolve}
                      className="w-full py-3 font-mono text-[11px] tracking-widest border flex items-center justify-center gap-2 hover:bg-volunteer/15 transition"
                      style={{ borderColor: '#3FB950', color: '#3FB950' }}
                    >
                      <Flag size={13} strokeWidth={2.4} />
                      CONFIRM RESOLVED
                    </button>
                    <button
                      onClick={onUnresolvable}
                      className="w-full py-2.5 font-mono text-[11px] tracking-widest border border-zinc-700 text-zinc-400 flex items-center justify-center gap-2 hover:bg-critical/10 hover:border-critical/50 hover:text-critical transition"
                    >
                      <X size={13} strokeWidth={2.4} />
                      MARK UNRESOLVABLE{hasAlloc ? ' · REFUND INVENTORY' : ''}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // ZONE TICKET CARD — context-driven; opens assign/resolve modals
        // ───────────────────────────────────────────────────────────────
        function ZoneTicketCard({ signal, onOpen }) {
          const { updateSignal, allocateInventory, refundInventory } = useApp();
          const cat  = CATEGORY_META[signal.category] || CATEGORY_META.INFO;
          const pri  = PRIORITY_META[signal.priority] || PRIORITY_META.NORMAL;
          const Icon = cat.icon;
          const [showAssign,  setShowAssign]  = useState(false);
          const [showResolve, setShowResolve] = useState(false);

          const handleAssign = (volunteer, allocations) => {
            allocateInventory(signal.id, allocations, volunteer.name, volunteer.id);
            setShowAssign(false);
          };
          const handleResolve = () => {
            updateSignal(signal.id, { status: 'RESOLVED' });
            setShowResolve(false);
          };
          const handleUnresolvable = () => {
            refundInventory(signal.id, signal.inventory_allocated);
            setShowResolve(false);
          };

          const isAssignable = signal.status === 'NEW' || signal.status === 'ACKNOWLEDGED';
          const isResolvable = signal.status === 'IN_PROGRESS';
          const isDone       = signal.status === 'RESOLVED' || signal.status === 'EXPIRED';

          return (
            <>
              <div
                className="bg-ink-900/70 border border-zinc-800 overflow-hidden"
                style={{ borderLeftColor: pri.color, borderLeftWidth: 3 }}
              >
                {/* Ticket header — tap to open detail */}
                <button
                  onClick={onOpen}
                  className="w-full text-left flex items-start gap-3 p-3 hover:bg-ink-800/50 transition"
                >
                  <div
                    className="w-9 h-9 shrink-0 flex items-center justify-center rounded-sm"
                    style={{ background: cat.color + '14', border: `1px solid ${cat.color}44`, color: cat.color }}
                  >
                    <Icon size={15} strokeWidth={2.2} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <CategoryChip category={signal.category} />
                      <StatusPill status={signal.status} />
                      {signal.assigned_to_name && (
                        <span
                          className="font-mono text-[9px] tracking-widest px-1.5 py-0.5 border"
                          style={{ color: '#3FB950', borderColor: '#3FB95044', background: '#3FB95010' }}
                        >
                          {signal.assigned_to_name}
                        </span>
                      )}
                      <span className="ml-auto font-mono text-[10px] text-zinc-500">
                        {timeAgo(signal.created_at)}
                      </span>
                    </div>
                    <p className="text-[13px] text-zinc-200 leading-snug line-clamp-2">
                      {signal.summary || signal.message}
                    </p>
                    {signal.people_count > 0 && (
                      <span className="font-mono text-[10px] text-zinc-500 mt-1 flex items-center gap-1">
                        <Users size={10} /> {signal.people_count} ppl · {signal.manual_location || '—'}
                      </span>
                    )}
                    {/* Show allocated inventory inline */}
                    {signal.inventory_allocated && Object.keys(signal.inventory_allocated).length > 0 && (
                      <div className="mt-1.5 flex flex-wrap gap-1">
                        {Object.entries(signal.inventory_allocated).map(([k, v]) => (
                          <span key={k} className="font-mono text-[9px] tracking-widest text-zinc-400 border border-zinc-700 px-1.5 py-0.5">
                            {k} ×{v}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>
                </button>

                {/* Action row — changes based on ticket status */}
                {isAssignable && (
                  <div className="grid grid-cols-2 border-t border-zinc-800 divide-x divide-zinc-800">
                    <button
                      onClick={() => updateSignal(signal.id, { status: 'ACKNOWLEDGED' })}
                      disabled={signal.status === 'ACKNOWLEDGED'}
                      className="flex items-center justify-center gap-1.5 py-2 font-mono text-[10px] tracking-widest transition text-zinc-400 hover:text-high hover:bg-high/10 disabled:text-high disabled:bg-high/[0.07]"
                    >
                      <CheckCircle2 size={11} strokeWidth={2.4} /> ACK
                    </button>
                    <button
                      onClick={() => setShowAssign(true)}
                      className="flex items-center justify-center gap-1.5 py-2 font-mono text-[10px] tracking-widest text-zinc-400 hover:text-volunteer hover:bg-volunteer/10 transition"
                    >
                      <Users size={11} strokeWidth={2.4} /> ASSIGN
                    </button>
                  </div>
                )}
                {isResolvable && (
                  <div className="grid grid-cols-2 border-t border-zinc-800 divide-x divide-zinc-800">
                    <button
                      onClick={() => setShowResolve(true)}
                      className="flex items-center justify-center gap-1.5 py-2 font-mono text-[10px] tracking-widest text-zinc-400 hover:text-volunteer hover:bg-volunteer/10 transition"
                    >
                      <Flag size={11} strokeWidth={2.4} /> RESOLVE…
                    </button>
                    <button
                      onClick={handleUnresolvable}
                      className="flex items-center justify-center gap-1.5 py-2 font-mono text-[10px] tracking-widest text-zinc-400 hover:text-critical hover:bg-critical/10 transition"
                    >
                      <X size={11} strokeWidth={2.4} /> UNRESOLVABLE
                    </button>
                  </div>
                )}
                {isDone && (
                  <div
                    className="flex items-center justify-center gap-2 py-2 font-mono text-[10px] tracking-widest border-t border-zinc-800"
                    style={{ color: signal.status === 'RESOLVED' ? '#3FB950' : '#71717a' }}
                  >
                    {signal.status === 'RESOLVED'
                      ? <><Flag size={11} strokeWidth={2.4} /> RESOLVED</>
                      : <><X size={11} strokeWidth={2.4} /> UNRESOLVABLE</>}
                  </div>
                )}
              </div>

              {/* Portalled modals render as siblings to avoid stacking-context issues */}
              {showAssign  && <AssignTicketModal  signal={signal} onClose={() => setShowAssign(false)}  onAssign={handleAssign} />}
              {showResolve && <ResolveTicketModal signal={signal} onClose={() => setShowResolve(false)} onResolve={handleResolve} onUnresolvable={handleUnresolvable} />}
            </>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // MAP SCREEN
        // ───────────────────────────────────────────────────────────────
        function MapScreen({ session, onOpenSignal }) {
          const { signals } = useApp();
          const role = session.role;
          const [mapPins,     setMapPins]     = useState(MAP_PINS);
          const [selected,    setSelected]    = useState(null);
          const [dropMode,    setDropMode]    = useState(false);
          const [pendingDrop, setPendingDrop] = useState(null); // { x, y } %
          const mapRef = useRef(null);

          // Pins for signals currently IN_PROGRESS (active operation overlay)
          const activeOpsPins = useMemo(() =>
            signals
              .filter((s) => s.status === 'IN_PROGRESS')
              .map((s) => mapPins.find((p) => p.id === s.id))
              .filter(Boolean),
          [signals, mapPins]);

          // Visibility rules per role
          const visiblePins = useMemo(() => mapPins.filter((p) => {
            if (role === 'CIVILIAN') return p.kind === 'safezone' || p.kind === 'authority';
            if (role === 'VOLUNTEER') return p.kind !== 'civilian';
            return true;
          }), [role, mapPins]);

          const handleMapClick = (e) => {
            if (!dropMode || role !== 'AUTHORITY') return;
            if (e.target !== mapRef.current && !mapRef.current.contains(e.target)) return;
            const rect = mapRef.current.getBoundingClientRect();
            const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
            const y = Math.round(((e.clientY - rect.top)  / rect.height) * 100);
            setPendingDrop({ x, y });
          };

          const confirmDrop = (zoneType) => {
            const names = { SHELTER: 'Field Shelter', MEDICAL: 'Medical Post', SUPPLY: 'Supply Cache', EVAC_POINT: 'Evac Point' };
            setMapPins((prev) => [
              ...prev,
              {
                id:       'sz-' + Math.random().toString(36).slice(2, 6),
                kind:     'safezone',
                zoneType,
                x:        pendingDrop.x,
                y:        pendingDrop.y,
                label:    names[zoneType] + ' (new)',
                isNew:    true,
              },
            ]);
            setPendingDrop(null);
            setDropMode(false);
          };

          const pinColor = (p) => {
            if (p.kind === 'signal')    return PRIORITY_META[p.priority]?.color || '#a1a1aa';
            if (p.kind === 'safezone')  return '#3FB950';
            if (p.kind === 'authority') return '#F78166';
            if (p.kind === 'volunteer') return '#58A6FF';
            return '#a1a1aa';
          };
          const pinIcon = (p) => {
            if (p.kind === 'signal')    return CATEGORY_META[p.category]?.icon || MapPin;
            if (p.kind === 'safezone')  return Tent;
            if (p.kind === 'authority') return Shield;
            if (p.kind === 'volunteer') return LifeBuoy;
            return MapPin;
          };

          return (
            <div className="relative h-[calc(100vh-3rem-3rem)] overflow-hidden bg-ink-950">
              {/* Map canvas */}
              <div
                ref={mapRef}
                className="absolute inset-0 grid-bg"
                onClick={handleMapClick}
                style={dropMode ? { cursor: 'crosshair' } : {}}
              >
                {/* Grid lines */}
                <div className="absolute inset-0 pointer-events-none">
                  <span className="absolute top-1/2 left-0 right-0 h-px bg-zinc-800/60" />
                  <span className="absolute top-0 bottom-0 left-1/2 w-px bg-zinc-800/60" />
                  {[1, 2, 3, 4].map((r) => (
                    <span
                      key={r}
                      className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 border border-zinc-800/40 rounded-full"
                      style={{ width: `${r * 22}%`, height: `${r * 22}%` }}
                    />
                  ))}
                </div>

                {/* Active operation zone circles — rendered behind pins */}
                {activeOpsPins.map((pin) => (
                  <span
                    key={'aop-' + pin.id}
                    className="absolute -translate-x-1/2 -translate-y-1/2 rounded-full pointer-events-none"
                    style={{
                      left:       `${pin.x}%`,
                      top:        `${pin.y}%`,
                      width:      '90px',
                      height:     '90px',
                      background: 'rgba(88,166,255,0.07)',
                      border:     '1.5px dashed rgba(88,166,255,0.38)',
                      boxShadow:  '0 0 22px rgba(88,166,255,0.13)',
                    }}
                  />
                ))}

                {/* Pending drop preview */}
                {pendingDrop && (
                  <span
                    className="absolute -translate-x-1/2 -translate-y-1/2 pointer-events-none"
                    style={{ left: `${pendingDrop.x}%`, top: `${pendingDrop.y}%` }}
                  >
                    <span className="flex items-center justify-center w-7 h-7 rounded-sm border-2 border-dashed border-volunteer/80 bg-volunteer/10 animate-pulse">
                      <Tent size={13} strokeWidth={2.4} className="text-volunteer" />
                    </span>
                  </span>
                )}

                {/* Pins */}
                {visiblePins.map((p) => {
                  const color      = pinColor(p);
                  const PinIcon    = pinIcon(p);
                  const isSelected = selected?.id === p.id;
                  const isActiveOp = activeOpsPins.some((ap) => ap.id === p.id);
                  return (
                    <button
                      key={p.id}
                      onClick={(e) => { e.stopPropagation(); if (!dropMode) setSelected(p); }}
                      className="absolute -translate-x-1/2 -translate-y-1/2 group"
                      style={{ left: `${p.x}%`, top: `${p.y}%` }}
                    >
                      {p.kind === 'signal' && (p.priority === 'CRITICAL' || p.priority === 'HIGH') && (
                        <span
                          className="absolute inset-0 -m-2 rounded-full animate-ping"
                          style={{ background: color + '33' }}
                        />
                      )}
                      <span
                        className={cx(
                          'relative flex items-center justify-center w-7 h-7 rounded-sm border-2 transition',
                          isSelected ? 'scale-110' : ''
                        )}
                        style={{
                          background:  color + '22',
                          borderColor: isActiveOp ? '#58A6FF' : color,
                          color,
                          boxShadow:   isSelected ? `0 0 16px ${color}` : `0 0 8px ${color}55`,
                        }}
                      >
                        <PinIcon size={13} strokeWidth={2.4} />
                      </span>
                      {/* blue IN_PROGRESS dot */}
                      {isActiveOp && (
                        <span
                          className="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full border border-ink-950 animate-pulse"
                          style={{ background: '#58A6FF' }}
                        />
                      )}
                      {/* "new" indicator for dropped zones */}
                      {p.isNew && (
                        <span
                          className="absolute -top-1 -left-1 w-2.5 h-2.5 rounded-full border border-ink-950"
                          style={{ background: '#3FB950' }}
                        />
                      )}
                    </button>
                  );
                })}

                {/* Self marker */}
                <div className="absolute left-[52%] top-[48%] -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                  <span className="absolute inset-0 -m-3 rounded-full bg-civilian/20 animate-ping" />
                  <span className="relative block w-3 h-3 rounded-full bg-civilian ring-2 ring-ink-950" />
                </div>
              </div>

              {/* Top tactical overlay */}
              <div className="absolute top-0 inset-x-0 p-3 flex items-start justify-between pointer-events-none">
                <div className="font-mono text-[10px] tracking-widest text-zinc-400 bg-ink-950/80 border border-zinc-800 px-2 py-1 pointer-events-auto">
                  <div className="flex items-center gap-1.5">
                    <Crosshair size={11} strokeWidth={2.2} />
                    GRID 28.61°N 77.21°E
                  </div>
                  <div className="text-zinc-600 mt-0.5">ZOOM 14 · OSM CACHE 92%</div>
                </div>
                <div className="flex flex-col gap-1.5 pointer-events-auto">
                  <button className="w-9 h-9 flex items-center justify-center bg-ink-950/80 border border-zinc-800 text-zinc-300 hover:bg-ink-800">
                    <Layers size={14} />
                  </button>
                  <button className="w-9 h-9 flex items-center justify-center bg-ink-950/80 border border-zinc-800 text-zinc-300 hover:bg-ink-800">
                    <Navigation size={14} />
                  </button>
                  {role === 'AUTHORITY' && (
                    <button
                      onClick={() => { setDropMode((p) => !p); setSelected(null); setPendingDrop(null); }}
                      className="w-9 h-9 flex items-center justify-center border transition-colors"
                      style={dropMode
                        ? { background: '#3FB95022', borderColor: '#3FB950', color: '#3FB950' }
                        : { background: 'rgba(13,15,26,0.8)', borderColor: '#3d4452', color: '#a1a1aa' }
                      }
                      title="Drop safe zone"
                    >
                      <Tent size={14} />
                    </button>
                  )}
                </div>
              </div>

              {/* Drop mode hint */}
              {dropMode && !pendingDrop && (
                <div className="absolute left-3 right-3 pointer-events-none" style={{ top: '3.75rem' }}>
                  <div className="bg-volunteer/12 border border-volunteer/40 px-3 py-2 font-mono text-[10px] tracking-widest text-volunteer flex items-center gap-2">
                    <Tent size={11} strokeWidth={2.2} />
                    TAP MAP TO PLACE SAFE ZONE — TAP BUTTON AGAIN TO CANCEL
                  </div>
                </div>
              )}

              {/* Active ops count badge */}
              {activeOpsPins.length > 0 && !dropMode && (
                <div className="absolute top-3 left-1/2 -translate-x-1/2 pointer-events-none">
                  <div className="bg-civilian/12 border border-civilian/40 px-2 py-1 font-mono text-[9px] tracking-widest text-civilian flex items-center gap-1.5 whitespace-nowrap">
                    <span className="w-1.5 h-1.5 rounded-full bg-civilian animate-pulse" />
                    {activeOpsPins.length} ACTIVE OP{activeOpsPins.length > 1 ? 'S' : ''}
                  </div>
                </div>
              )}

              {/* Visibility legend */}
              <div
                className="absolute left-3 bg-ink-950/85 border border-zinc-800 p-2 max-w-[175px] pointer-events-auto transition-all"
                style={{ top: dropMode ? '6rem' : '5rem' }}
              >
                <div className="font-mono text-[9px] tracking-widest text-zinc-500 mb-1.5 flex items-center gap-1">
                  <Lock size={9} /> VISIBILITY · {ROLES[role].badge}
                </div>
                <div className="space-y-1 font-mono text-[10px] text-zinc-300">
                  {role === 'CIVILIAN' && (
                    <>
                      <LegendRow icon={Tent}    color="#3FB950" label="Safe zones" />
                      <LegendRow icon={Shield}  color="#F78166" label="Authority units" />
                      <LegendRow icon={Siren}   color="#71717a" label="Signals hidden" muted />
                    </>
                  )}
                  {role === 'VOLUNTEER' && (
                    <>
                      <LegendRow icon={Siren}    color="#FF4D4D" label="Distress signals" />
                      <LegendRow icon={Tent}     color="#3FB950" label="Safe zones" />
                      <LegendRow icon={Shield}   color="#F78166" label="Authority" />
                      <LegendRow icon={LifeBuoy} color="#58A6FF" label="Other volunteers" />
                    </>
                  )}
                  {role === 'AUTHORITY' && (
                    <>
                      <LegendRow icon={Siren}    color="#FF4D4D" label="All signals" />
                      <LegendRow icon={Tent}     color="#3FB950" label="Safe zones" />
                      <LegendRow icon={LifeBuoy} color="#58A6FF" label="Volunteers" />
                      <LegendRow icon={Users}    color="#a1a1aa" label="Civilians" />
                      <LegendRow icon={Circle}   color="#58A6FF" label="Active ops zone" />
                    </>
                  )}
                </div>
              </div>

              {/* Zone type picker (shown after drop tap) */}
              {pendingDrop && (
                <div className="absolute inset-x-3 bottom-16 pointer-events-auto">
                  <div className="bg-ink-900/98 border border-zinc-700 p-4">
                    <div className="font-mono text-[10px] tracking-widest text-zinc-500 mb-3 flex items-center gap-1.5">
                      <Tent size={10} /> SELECT ZONE TYPE
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      {[
                        { type: 'SHELTER',    icon: Tent,        label: 'Shelter',    color: '#3FB950' },
                        { type: 'MEDICAL',    icon: HeartPulse,  label: 'Medical',    color: '#FF4D4D' },
                        { type: 'SUPPLY',     icon: Package,     label: 'Supply',     color: '#FFD43B' },
                        { type: 'EVAC_POINT', icon: Navigation,  label: 'Evac Point', color: '#58A6FF' },
                      ].map(({ type, icon: ZIcon, label, color }) => (
                        <button
                          key={type}
                          onClick={() => confirmDrop(type)}
                          className="flex items-center gap-2 p-2.5 border hover:bg-zinc-800 transition-colors text-left"
                          style={{ borderColor: color + '55' }}
                        >
                          <ZIcon size={14} style={{ color }} strokeWidth={2.2} />
                          <span className="text-[12px] text-zinc-200 font-medium">{label}</span>
                        </button>
                      ))}
                    </div>
                    <button
                      onClick={() => setPendingDrop(null)}
                      className="mt-2 w-full text-center font-mono text-[10px] tracking-widest text-zinc-600 hover:text-zinc-400 py-1"
                    >
                      CANCEL
                    </button>
                  </div>
                </div>
              )}

              {/* Bottom selection sheet */}
              {selected && !dropMode && (
                <div className="absolute inset-x-0 bottom-0 bg-ink-900/95 backdrop-blur border-t border-zinc-800 p-3 pointer-events-auto">
                  <div className="flex items-start gap-3">
                    <div
                      className="w-10 h-10 shrink-0 flex items-center justify-center"
                      style={{
                        background: pinColor(selected) + '18',
                        border: `1px solid ${pinColor(selected)}55`,
                      }}
                    >
                      {selected.kind === 'signal'    && (() => { const I = CATEGORY_META[selected.category]?.icon || MapPin; return <I size={16} style={{ color: CATEGORY_META[selected.category]?.color }} />; })()}
                      {selected.kind === 'safezone'  && <Tent     size={16} className="text-volunteer" />}
                      {selected.kind === 'authority' && <Shield   size={16} className="text-authority" />}
                      {selected.kind === 'volunteer' && <LifeBuoy size={16} className="text-civilian"  />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-mono text-[10px] tracking-widest text-zinc-500 uppercase">
                          {selected.kind === 'safezone' ? selected.zoneType?.replace('_', ' ') : selected.kind}
                        </span>
                        {selected.kind === 'signal' && <CategoryChip category={selected.category} />}
                        {selected.kind === 'signal' && (
                          <span className="font-mono text-[10px] tracking-widest" style={{ color: PRIORITY_META[selected.priority]?.color }}>
                            {PRIORITY_META[selected.priority]?.label}
                          </span>
                        )}
                        {activeOpsPins.some((ap) => ap.id === selected.id) && (
                          <span className="font-mono text-[9px] tracking-widest text-civilian border border-civilian/40 px-1.5 py-0.5">
                            IN PROGRESS
                          </span>
                        )}
                      </div>
                      <div className="text-sm text-zinc-100 mt-1 font-medium">{selected.label}</div>
                      <div className="mt-1.5 flex gap-2 flex-wrap">
                        {selected.kind === 'signal' && (
                          <button
                            onClick={() => onOpenSignal(selected.id)}
                            className="px-3 py-1 border border-civilian/60 text-civilian font-mono text-[10px] tracking-widest hover:bg-civilian/15"
                          >
                            VIEW DETAIL
                          </button>
                        )}
