          if (mi < 60) return `${mi}m`;

          return `${Math.floor(h / 24)}d`;

          const meta = STATUS_META[status] || { label: status, color: '#a1a1aa' };
          return (
            <span
              className="font-mono text-[10px] tracking-widest px-1.5 py-0.5 border rounded-sm"
              style={{ color: meta.color, borderColor: meta.color + '55' }}
            >
              {meta.label}
            </span>
          );
        }

        function CategoryChip({ category }) {
          const meta = CATEGORY_META[category];
          const Icon = meta.icon;
          return (
            <span
              className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-sm text-[10px] tracking-widest font-mono"
              style={{ color: meta.color, background: meta.color + '14', border: `1px solid ${meta.color}33` }}
            >
              <Icon size={11} strokeWidth={2.4} />
              {meta.label.toUpperCase()}
            </span>
          );
        }

        function HopBadge({ hop, ttl }) {
          return (
            <span className="font-mono text-[10px] text-zinc-500 tracking-widest">
              ↻ {hop}/{ttl}
            </span>
          );
        }

        function TacticalCorners({ children, className, accent = '#27272a' }) {
          return (
            <div className={cx('relative', className)}>
              {['top-0 left-0 border-l border-t', 'top-0 right-0 border-r border-t',
                'bottom-0 left-0 border-l border-b', 'bottom-0 right-0 border-r border-b']
                .map((p, i) => (
                  <span
                    key={i}
                    className={cx('absolute w-2 h-2 pointer-events-none', p)}
                    style={{ borderColor: accent }}
                  />
                ))}
              {children}
            </div>
          );
        }

        function SectionHeader({ icon: Icon, label, suffix, count }) {
          return (
            <div className="flex items-center gap-2 px-1 mb-2.5">
              {Icon && <Icon size={13} className="text-zinc-500" strokeWidth={2.2} />}
              <span className="font-mono text-[11px] tracking-[0.18em] text-zinc-400 uppercase">
                {label}
              </span>
              {typeof count === 'number' && (
                <span className="font-mono text-[10px] tracking-widest text-zinc-600">
                  [{String(count).padStart(2, '0')}]
                </span>
              )}
              <span className="flex-1 h-px bg-zinc-800/80 ml-1" />
              {suffix}
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // TOP APP BAR
        // ───────────────────────────────────────────────────────────────
        function TopBar({ session, peerCount, battery, aiState, onOpenAiPanel, onOpenSettings }) {
          const role = ROLES[session.role];
          const RoleIcon = role.icon;
          const BatIcon = battery > 60 ? BatteryFull : battery > 25 ? BatteryMedium : BatteryLow;
          const batColor = battery > 60 ? '#3FB950' : battery > 25 ? '#FFA033' : '#FF4D4D';

          const aiPill = useMemo(() => {
            if (aiState.status === 'absent')      return { label: 'MODEL ABSENT', color: '#71717a', Icon: Download };
            if (aiState.status === 'downloading') return { label: `DL ${Math.round(aiState.progress)}%`, color: '#58A6FF', Icon: Loader2, spin: true };
            if (aiState.status === 'verifying')   return { label: 'VERIFY', color: '#FFA033', Icon: Loader2, spin: true };
            if (aiState.status === 'ready')       return { label: 'AI READY', color: '#3FB950', Icon: Sparkles };
            if (aiState.status === 'error')       return { label: 'AI ERROR', color: '#FF4D4D', Icon: AlertTriangle };
            return { label: 'AI', color: '#a1a1aa', Icon: Sparkles };
          }, [aiState]);

          return (
            <header className="sticky top-0 z-30 bg-ink-950/95 backdrop-blur border-b border-zinc-900">
              <div className="flex items-center gap-2 px-3 h-12">
                {/* Role badge */}
                <div
                  className="flex items-center gap-1.5 pl-1 pr-2 py-1 rounded-sm border font-mono text-[10px] tracking-widest"
                  style={{ borderColor: role.accent + '66', color: role.accent }}
                >
                  <RoleIcon size={12} strokeWidth={2.4} />
                  {role.badge}
                </div>
                <div className="font-mono text-xs text-zinc-200 truncate max-w-[120px]">
                  {session.name}
                </div>

                {/* Mesh status */}
                <div className="ml-auto flex items-center gap-1.5 pl-2 pr-2 py-1 rounded-sm border border-zinc-800 font-mono text-[10px] tracking-widest text-zinc-300">
                  <span className="relative flex w-2 h-2">
                    <span className={cx('absolute inset-0 rounded-full',
                      peerCount > 0 ? 'bg-volunteer animate-pulse-slow' : 'bg-zinc-700')} />
                    <span className={cx('relative w-2 h-2 rounded-full',
                      peerCount > 0 ? 'bg-volunteer' : 'bg-zinc-700')} />
                  </span>
                  MESH {String(peerCount).padStart(2, '0')}
                </div>

                {/* Battery */}
                <div className="hidden sm:flex items-center gap-1 font-mono text-[10px] tracking-widest" style={{ color: batColor }}>
                  <BatIcon size={14} strokeWidth={2.2} />
                  {battery}%
                </div>

                {/* AI pill (opens panel) */}
                <button
                  onClick={onOpenAiPanel}
                  className="flex items-center gap-1.5 pl-1.5 pr-2 py-1 rounded-sm border font-mono text-[10px] tracking-widest hover:bg-zinc-900 transition"
                  style={{ borderColor: aiPill.color + '66', color: aiPill.color }}
                >
                  <aiPill.Icon size={12} strokeWidth={2.4} className={aiPill.spin ? 'animate-spin' : ''} />
                  {aiPill.label}
                </button>

                <button
                  onClick={onOpenSettings}
                  className="p-1.5 rounded-sm border border-zinc-800 hover:bg-zinc-900 transition text-zinc-400"
                >
                  <Settings size={13} strokeWidth={2.2} />
                </button>
              </div>
            </header>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // GEMMA AI EXPANDABLE PANEL
        // ───────────────────────────────────────────────────────────────
        function GemmaPanel({ open, onClose, aiState, onDownload, onCancel, onRetry, isPrimary }) {
          if (!open) return null;

          const { status, progress, sizeMb, downloadedMb, errorMessage } = aiState;
          const statusConfig = {
            absent:      { color: '#71717a', label: 'MODEL ABSENT',     Icon: Download },
            downloading: { color: '#58A6FF', label: 'DOWNLOADING',      Icon: Loader2 },
            verifying:   { color: '#FFA033', label: 'VERIFYING SHA-256', Icon: ShieldCheck },
            ready:       { color: '#3FB950', label: 'AI READY',          Icon: Sparkles },
            error:       { color: '#FF4D4D', label: 'ERROR',             Icon: AlertTriangle },
          };
          const cfg = statusConfig[status];
          const Icon = cfg.Icon;

          return (
            <div
              className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-3 sm:p-6"
              onClick={onClose}
            >
              <TacticalCorners
                accent={cfg.color + '88'}
                className="w-full max-w-md bg-ink-900 border border-zinc-800 p-4 sm:p-5"
              >
                <div onClick={(e) => e.stopPropagation()}>
                  <div className="flex items-start justify-between gap-3 mb-4">
                    <div>
                      <div className="flex items-center gap-2 mb-1">
                        <Bot size={16} className="text-zinc-300" strokeWidth={2.2} />
                        <span className="font-mono text-[11px] tracking-[0.22em] text-zinc-300 uppercase">
                          Gemma 3n E2B · LiteRT
                        </span>
                      </div>
                      <div className="flex items-center gap-2">
                        <Icon
                          size={14}
                          className={status === 'downloading' || status === 'verifying' ? 'animate-spin' : ''}
                          style={{ color: cfg.color }}
                          strokeWidth={2.4}
                        />
                        <span className="font-mono text-sm tracking-widest" style={{ color: cfg.color }}>
                          {cfg.label}
                        </span>
                      </div>
                    </div>
                    <button onClick={onClose} className="p-1 -m-1 text-zinc-500 hover:text-zinc-200">
                      <X size={16} />
                    </button>
                  </div>

                  {status === 'absent' && (
                    <>
                      <p className="text-[13px] leading-relaxed text-zinc-400 mb-4">
                        On-device AI is <span className="text-zinc-200">not installed</span>.
                        Download once, ideally <span className="text-civilian">pre-disaster</span>,
                        over Wi-Fi. The mesh and chat work fine without it.
                      </p>
                      <div className="grid grid-cols-2 gap-2 mb-4 font-mono text-[10px] tracking-widest text-zinc-500">
                        <div className="border border-zinc-800 p-2">
                          <div className="text-zinc-600 mb-0.5">SIZE</div>
                          <div className="text-zinc-200">~3.0 GB</div>
                        </div>
                        <div className="border border-zinc-800 p-2">
                          <div className="text-zinc-600 mb-0.5">QUANT</div>
                          <div className="text-zinc-200">INT4</div>
                        </div>
                        <div className="border border-zinc-800 p-2">
                          <div className="text-zinc-600 mb-0.5">FORMAT</div>
                          <div className="text-zinc-200">.task</div>
                        </div>
                        <div className="border border-zinc-800 p-2">
                          <div className="text-zinc-600 mb-0.5">VERIFY</div>
                          <div className="text-zinc-200">SHA-256</div>
                        </div>
                      </div>
                      <button
                        onClick={onDownload}
                        className="w-full flex items-center justify-center gap-2 py-3 bg-civilian/15 border border-civilian/60 hover:bg-civilian/25 transition text-civilian font-mono text-xs tracking-widest"
                      >
                        <Download size={14} strokeWidth={2.4} />
                        DOWNLOAD MODEL (3.0 GB)
                      </button>
                      <p className="mt-3 font-mono text-[10px] tracking-widest text-zinc-600 text-center">
                        RESUMABLE · BACKGROUND · ONE-TIME
                      </p>
                    </>
                  )}

                  {status === 'downloading' && (
                    <>
                      <div className="mb-2 flex items-center justify-between font-mono text-xs">
                        <span className="text-zinc-300">{downloadedMb} MB / {sizeMb} MB</span>
                        <span className="text-civilian">{progress.toFixed(1)}%</span>
                      </div>
                      <div className="h-2 w-full bg-zinc-800 overflow-hidden mb-1">
                        <div
                          className="h-full bg-civilian transition-all duration-300"
                          style={{
                            width: `${progress}%`,
                            boxShadow: '0 0 12px #58A6FF',
                          }}
                        />
                      </div>
                      <div className="mb-4 font-mono text-[10px] tracking-widest text-zinc-500 flex justify-between">
                        <span>↓ 4.2 MB/s</span>
                        <span>ETA ~{Math.max(1, Math.round((100 - progress) * 0.8))} s</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={onCancel}
                          className="flex items-center justify-center gap-2 py-2.5 border border-zinc-700 hover:bg-zinc-800 text-zinc-300 font-mono text-[11px] tracking-widest"
                        >
                          <Pause size={12} strokeWidth={2.4} /> PAUSE
                        </button>
                        <button
                          disabled
                          className="flex items-center justify-center gap-2 py-2.5 border border-zinc-800 text-zinc-600 font-mono text-[11px] tracking-widest"
                        >
                          <X size={12} strokeWidth={2.4} /> CANCEL
                        </button>
                      </div>
                    </>
                  )}

                  {status === 'verifying' && (
                    <>
                      <div className="h-2 w-full bg-zinc-800 mb-3 overflow-hidden">
                        <div className="h-full bg-high animate-pulse" style={{ width: '100%' }} />
                      </div>
                      <p className="font-mono text-[11px] tracking-widest text-zinc-400 text-center">
                        VERIFYING SHA-256 INTEGRITY...
                      </p>
                    </>
                  )}

                  {status === 'ready' && (
                    <>
                      <div className="grid grid-cols-2 gap-2 mb-4 font-mono text-[10px] tracking-widest text-zinc-500">
                        <div className="border border-zinc-800 p-2">
                          <div className="text-zinc-600 mb-0.5">MODEL</div>
                          <div className="text-zinc-200">gemma-3n-e2b-int4</div>
                        </div>
                        <div className="border border-zinc-800 p-2">
                          <div className="text-zinc-600 mb-0.5">SIZE</div>
                          <div className="text-zinc-200">2.94 GB</div>
                        </div>
                        <div className="border border-volunteer/60 p-2">
                          <div className="text-zinc-600 mb-0.5">STATUS</div>
                          <div className="text-volunteer">READY</div>
                        </div>
                        <div className="border border-zinc-800 p-2">
                          <div className="text-zinc-600 mb-0.5">CACHE</div>
                          <div className="text-zinc-200">42 hits</div>
                        </div>
                      </div>
                      <p className="text-[13px] leading-relaxed text-zinc-400">
                        Gemma is running locally. Triage, translation and the Help Assistant are available offline.
                      </p>
                    </>
                  )}

                  {status === 'error' && (
                    <>
                      <p className="text-[13px] text-zinc-400 mb-4">{errorMessage || 'Verification failed.'}</p>
                      <button
                        onClick={onRetry}
                        className="w-full flex items-center justify-center gap-2 py-3 bg-critical/15 border border-critical/60 hover:bg-critical/25 transition text-critical font-mono text-xs tracking-widest"
                      >
                        <RefreshCw size={14} strokeWidth={2.4} />
                        RETRY DOWNLOAD
                      </button>
                    </>
                  )}
                </div>
              </TacticalCorners>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // LOGIN / ROLE SELECTION
        // ───────────────────────────────────────────────────────────────
        function LoginScreen({ onContinue }) {
          const [name, setName] = useState('');
          const [role, setRole] = useState(null);

          const canSubmit = name.trim().length >= 2 && role;

          return (
            <div className="min-h-screen flex flex-col bg-ink-950 grid-bg relative overflow-hidden">
              <div className="scanline absolute inset-0 pointer-events-none" />

              <div className="relative flex-1 flex flex-col px-5 pt-12 pb-6 max-w-md mx-auto w-full">
                {/* Header */}
                <div className="mb-8">
                  <div className="flex items-center gap-2 font-mono text-[10px] tracking-[0.3em] text-zinc-500 mb-3">
                    <span className="w-6 h-px bg-zinc-700" />
                    SECURE INIT
                    <span className="w-2 h-2 rounded-full bg-volunteer animate-blink" />
                  </div>
                  <h1 className="text-3xl font-bold tracking-tight text-zinc-50">
                    DISASTER<span className="text-civilian">MESH</span>
                  </h1>
                  <p className="mt-2 font-mono text-[11px] tracking-widest text-zinc-500">
                    OFFLINE PEER-TO-PEER RELIEF MESH · v1
                  </p>
                </div>

                {/* Name input */}
                <div className="mb-6">
                  <label className="block font-mono text-[10px] tracking-[0.22em] text-zinc-500 uppercase mb-2">
                    Display Name
                  </label>
                  <div className="relative">
                    <input
                      autoFocus
                      value={name}
                      maxLength={32}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="e.g. Priya K."
                      className="w-full bg-ink-900 border border-zinc-800 focus:border-civilian/70 focus:ring-1 focus:ring-civilian/40 outline-none px-3 py-3 text-zinc-100 placeholder:text-zinc-600 font-mono text-sm"
                    />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 font-mono text-[10px] text-zinc-600">
                      {name.length}/32
                    </span>
                  </div>
                  <p className="mt-1.5 font-mono text-[10px] tracking-widest text-zinc-600">
                    visible to peers on the mesh
                  </p>
                </div>

                {/* Role selection */}
                <div className="mb-6">
                  <label className="block font-mono text-[10px] tracking-[0.22em] text-zinc-500 uppercase mb-2">
                    Select Role
                  </label>
                  <div className="space-y-2">
                    {Object.values(ROLES).map((r) => {
                      const RIcon = r.icon;
                      const selected = role === r.id;
                      return (
                        <button
                          key={r.id}
                          onClick={() => setRole(r.id)}
                          className={cx(
                            'w-full text-left flex items-center gap-3 p-3.5 border transition',
                            selected
                              ? 'bg-ink-800/80'
                              : 'bg-ink-900 border-zinc-800 hover:bg-ink-850'
                          )}
                          style={selected ? { borderColor: r.accent, boxShadow: `inset 0 0 0 1px ${r.accent}55` } : {}}
                        >
                          <div
                            className="flex items-center justify-center w-10 h-10 shrink-0"
                            style={{
                              background: r.accent + '15',
                              border: `1px solid ${r.accent}55`,
                              color: r.accent,
                            }}
                          >
                            <RIcon size={18} strokeWidth={2.2} />
                          </div>
                          <div className="flex-1">
                            <div className="flex items-center gap-2">
                              <span className="font-mono text-[10px] tracking-widest" style={{ color: r.accent }}>
                                [{r.badge}]
                              </span>
                              <span className="text-zinc-100 text-sm font-medium">{r.label}</span>
                            </div>
                            <p className="text-[12px] text-zinc-500 mt-0.5">{r.blurb}</p>
                          </div>
                          <Circle
                            size={14}
                            className={cx('shrink-0', selected ? 'fill-current' : '')}
                            style={{ color: selected ? r.accent : '#3f3f46' }}
                          />
                        </button>
                      );
                    })}
                  </div>
                </div>

                <button
                  disabled={!canSubmit}
                  onClick={() => onContinue({ name: name.trim(), role })}
                  className={cx(
                    'mt-auto w-full py-3.5 font-mono text-sm tracking-[0.22em] uppercase border transition flex items-center justify-center gap-2',
                    canSubmit
                      ? 'bg-civilian/15 border-civilian text-civilian hover:bg-civilian/25'
                      : 'border-zinc-800 text-zinc-600 cursor-not-allowed'
                  )}
                >
                  Join Mesh <ArrowRight size={14} strokeWidth={2.4} />
                </button>

                <div className="mt-4 flex items-center justify-between font-mono text-[10px] tracking-widest text-zinc-600">
                  <span>NODE a3f4-9b2c-…</span>
                  <span className="flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-volunteer animate-pulse-slow" />
                    DISCOVERING PEERS
                  </span>
                </div>
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // CIVILIAN DASHBOARD
        // ───────────────────────────────────────────────────────────────
        function CivilianDashboard({ session, signals, aiState, onRaise, onOpenAssistant, onOpenSignal }) {
          const mySignals = signals.filter((s) => s.sender_name === session.name);
          const showcaseSignals = mySignals.length ? mySignals : signals.slice(0, 2);

          return (
            <div className="px-3 pt-3 pb-28 space-y-5">
              {/* Greeting */}
              <div className="px-1">
                <p className="font-mono text-[10px] tracking-widest text-zinc-500 mb-1">
                  CIVILIAN · OFFLINE OK
                </p>
                <h1 className="text-xl font-bold text-zinc-100">
                  Stay safe, {session.name.split(' ')[0]}.
                </h1>
                <p className="text-[13px] text-zinc-500 mt-1">
                  Tap a category to raise a signal. Your phone keeps a copy until the mesh confirms delivery.
                </p>
              </div>

              {/* Raise Signal */}
              <section>
                <SectionHeader icon={Siren} label="Raise Signal" />
                <div className="grid grid-cols-3 gap-2">
                  {['MEDICAL', 'RESCUE', 'RESOURCE'].map((cat) => {

                        <div

                          style={{ background: m.color + '18', border: `1px solid ${m.color}55`, color: m.color }}

                          <Icon size={20} strokeWidth={2.2} />
                        </div>
                        <span className="font-mono text-[10px] tracking-widest" style={{ color: m.color }}>
                          {m.label.toUpperCase()}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </section>

              {/* AI Help Assistant — prominent for civilians */}
              <section>
                <SectionHeader icon={Sparkles} label="Survival Assistant" suffix={
                  <span className="font-mono text-[10px] tracking-widest"
                    style={{ color: aiState.status === 'ready' ? '#3FB950' : '#71717a' }}>
                    {aiState.status === 'ready' ? 'ONLINE' : aiState.status === 'downloading' ? 'DOWNLOADING' : 'OFFLINE'}
                  </span>
                } />
                <button
                  onClick={onOpenAssistant}
                  className="w-full text-left p-3.5 border border-civilian/40 bg-civilian/[0.06] hover:bg-civilian/[0.1] transition relative overflow-hidden"
                >
                  <div
                    className="absolute -right-6 -top-6 w-24 h-24 rounded-full opacity-30 blur-2xl"
                    style={{ background: '#58A6FF' }}
                  />
                  <div className="relative flex items-start gap-3">
                    <div className="w-10 h-10 flex items-center justify-center rounded-sm bg-civilian/15 border border-civilian/60 text-civilian shrink-0">
                      <Bot size={18} strokeWidth={2.2} />
                    </div>
                    <div className="flex-1">
                      <div className="text-sm text-zinc-100 font-medium">
                        Ask Gemma anything — offline.
                      </div>
                      <p className="text-[12px] text-zinc-400 mt-0.5">
                        "How do I treat a deep cut?" · "What to do during an aftershock?"
                      </p>
                    </div>
                    <ChevronRight size={16} className="text-zinc-500 shrink-0 mt-1" />
                  </div>
                  {aiState.status !== 'ready' && (
                    <div className="relative mt-3 flex items-center gap-2 font-mono text-[10px] tracking-widest text-civilian/80">
                      <Download size={11} strokeWidth={2.4} />
                      {aiState.status === 'absent' && 'Tap to download model (3 GB · one-time)'}
                      {aiState.status === 'downloading' && `Downloading ${aiState.progress.toFixed(0)}% · keep app open`}
                      {aiState.status === 'verifying' && 'Verifying integrity…'}
                    </div>
                  )}
                </button>
              </section>

              {/* Active signals */}
              <section>
                <SectionHeader
                  icon={Activity}
                  label="My Active Signals"
                  count={showcaseSignals.length}
                />
                {showcaseSignals.length === 0 ? (
                  <div className="border border-dashed border-zinc-800 p-6 text-center">
                    <p className="font-mono text-[11px] tracking-widest text-zinc-500">
                      NO ACTIVE SIGNALS

                    <p className="text-[12px] text-zinc-600 mt-1">

            </div>
