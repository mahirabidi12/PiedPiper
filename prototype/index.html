        // ───────────────────────────────────────────────────────────────
        // SIGNAL CARD (shared)
        // ───────────────────────────────────────────────────────────────
        function SignalCard({ signal, onClick, compact }) {
          const cat = CATEGORY_META[signal.category];
          const pri = PRIORITY_META[signal.priority];
          const Icon = cat.icon;
          return (
            <button
              onClick={onClick}
              className="w-full text-left bg-ink-900/70 border border-zinc-800 hover:border-zinc-700 transition p-3 relative group"
            >
              <span
                className="absolute left-0 top-0 bottom-0 w-0.5"
                style={{ background: pri.color }}
              />
              <div className="flex items-start gap-3 pl-1.5">
                <div
                  className="w-9 h-9 shrink-0 flex items-center justify-center rounded-sm"
                  style={{ background: cat.color + '14', border: `1px solid ${cat.color}44`, color: cat.color }}
                >
                  <Icon size={16} strokeWidth={2.2} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <CategoryChip category={signal.category} />
                    <StatusPill status={signal.status} />
                    <span className="ml-auto font-mono text-[10px] text-zinc-500 tracking-widest">
                      {timeAgo(signal.created_at)}
                    </span>
                  </div>
                  <p className="text-[13px] text-zinc-200 leading-snug line-clamp-2">
                    {signal.summary || signal.message}
                  </p>
                  {!compact && (
                    <div className="mt-2 flex items-center gap-3 font-mono text-[10px] tracking-widest text-zinc-500">
                      {signal.manual_location && (
                        <span className="flex items-center gap-1">
                          <MapPin size={10} /> {signal.manual_location}
                        </span>
                      )}
                      {signal.people_count > 0 && (
                        <span className="flex items-center gap-1">
                          <Users size={10} /> {signal.people_count}
                        </span>
                      )}
                      <PriorityDot priority={signal.priority} />
                      <span style={{ color: pri.color }}>{pri.label}</span>
                      <span className="ml-auto"><HopBadge hop={signal.hop_count} ttl={signal.ttl} /></span>
                    </div>
                  )}
                </div>
              </div>
            </button>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // VOLUNTEER DASHBOARD
        // ───────────────────────────────────────────────────────────────
        function VolunteerDashboard({ session, tasks, signals, onOpenTask, onOpenSignal, onGoMap }) {
          const active = tasks.filter((t) => t.status !== 'DONE' && t.status !== 'CANCELLED');
          const nearby = signals.filter((s) => s.status !== 'RESOLVED').slice(0, 4);

          return (
            <div className="px-3 pt-3 pb-28 space-y-5">
              <div className="px-1">
                <p className="font-mono text-[10px] tracking-widest text-zinc-500 mb-1">
                  VOLUNTEER · FIELD
                </p>
                <h1 className="text-xl font-bold text-zinc-100">{session.name.split(' ')[0]}, you have {active.length} tasks.</h1>
                <p className="text-[13px] text-zinc-500 mt-1">
                  Tap a task to update status. Your location is shared with assigning authority only.
                </p>
              </div>

              {/* Stat strip */}
              <div className="grid grid-cols-3 gap-2">
                <StatTile icon={ClipboardList} label="Active Tasks"  value={active.length} accent="#3FB950" />
                <StatTile icon={Radar}        label="Nearby Signals" value={nearby.length}  accent="#58A6FF" />
                <StatTile icon={CheckCircle2} label="Resolved Today" value={4}              accent="#a1a1aa" />
              </div>

              {/* Tasks */}
              <section>
                <SectionHeader icon={ClipboardList} label="Assigned Tasks" count={active.length} />
                <div className="space-y-2">
                  {active.map((t) => (
                    <TaskCard key={t.id} task={t} onClick={() => onOpenTask(t.id)} />
                  ))}
                </div>
              </section>

              {/* Mini radar / nearby */}
              <section>
                <SectionHeader
                  icon={Radar}
                  label="Nearby Distress"
                  suffix={
                    <button
                      onClick={onGoMap}
                      className="font-mono text-[10px] tracking-widest text-civilian hover:underline flex items-center gap-1"
                    >
                      MAP <ChevronRight size={11} />
                    </button>
                  }
                />
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <RadarPreview />
                  <div className="space-y-1.5">
                    {nearby.slice(0, 3).map((s) => (
                      <button
                        key={s.id}
                        onClick={() => onOpenSignal(s.id)}
                        className="w-full text-left p-2 border border-zinc-800 hover:border-zinc-700 bg-ink-900/60 flex items-center gap-2"
                      >
                        <PriorityDot priority={s.priority} />
                        <span className="text-[12px] text-zinc-200 truncate flex-1">{s.summary || s.message}</span>
                        <span className="font-mono text-[10px] text-zinc-500">{timeAgo(s.created_at)}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </section>
            </div>
          );
        }

        function StatTile({ icon: Icon, label, value, accent }) {
          return (
            <div className="border border-zinc-800 bg-ink-900/60 p-3">
              <div className="flex items-center justify-between mb-2">
                <Icon size={14} style={{ color: accent }} strokeWidth={2.2} />
                <span className="font-mono text-[9px] tracking-widest text-zinc-600">VAL</span>
              </div>
              <div className="text-2xl font-bold leading-none" style={{ color: accent }}>
                {value}
              </div>
              <div className="mt-1 font-mono text-[10px] tracking-widest text-zinc-500 uppercase">
                {label}
              </div>
            </div>
          );
        }

        function TaskCard({ task, onClick }) {
          const cat = CATEGORY_META[task.category] || CATEGORY_META.INFO;
          const Icon = cat.icon;
          const statusColor = {
            ASSIGNED: '#FFD43B',
            ACCEPTED: '#58A6FF',
            EN_ROUTE: '#FFA033',
            DONE: '#3FB950',
            CANCELLED: '#71717a',
          }[task.status] || '#a1a1aa';

          return (
            <button
              onClick={onClick}
              className="w-full text-left bg-ink-900/70 border border-zinc-800 hover:border-zinc-700 transition p-3"
            >
              <div className="flex items-start gap-3">
                <div
                  className="w-9 h-9 shrink-0 flex items-center justify-center rounded-sm"
                  style={{ background: cat.color + '14', border: `1px solid ${cat.color}44`, color: cat.color }}
                >
                  <Icon size={16} strokeWidth={2.2} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <CategoryChip category={task.category} />
                    <span
                      className="font-mono text-[10px] tracking-widest px-1.5 py-0.5 border rounded-sm"
                      style={{ color: statusColor, borderColor: statusColor + '55' }}
                    >
                      {task.status}
                    </span>
                    <span className="ml-auto font-mono text-[10px] text-zinc-500 tracking-widest">
                      {timeAgo(task.created_at)}
                    </span>
                  </div>
                  <p className="text-[13px] text-zinc-100 leading-snug font-medium">
                    {task.title}
                  </p>
                  <p className="text-[12px] text-zinc-500 mt-0.5 leading-snug line-clamp-2">
                    {task.description}
                  </p>
                </div>
                <ChevronRight size={16} className="text-zinc-600 mt-1" />
              </div>
            </button>
          );
        }

        function RadarPreview() {
          return (
            <div className="relative aspect-square bg-ink-900/60 border border-zinc-800 overflow-hidden">
              {/* Concentric rings */}
              {[1, 2, 3].map((r) => (
                <span
                  key={r}
                  className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full border border-volunteer/30"
                  style={{ width: `${r * 30}%`, height: `${r * 30}%` }}
                />
              ))}
              <span className="absolute left-0 right-0 top-1/2 h-px bg-volunteer/20" />
              <span className="absolute top-0 bottom-0 left-1/2 w-px bg-volunteer/20" />

              {/* Sweep */}
              <span
                className="absolute left-1/2 top-1/2 origin-top-left animate-radar"
                style={{
                  width: '50%', height: '50%',
                  background: 'conic-gradient(from 0deg, rgba(63,185,80,0.35), transparent 70deg)',
                  transformOrigin: '0 0',
                }}
              />

              {/* Pings */}
              {[
                { x: 64, y: 38, c: '#FF4D4D' },
                { x: 30, y: 60, c: '#FFA033' },
                { x: 70, y: 70, c: '#FFD43B' },
                { x: 48, y: 28, c: '#58A6FF' },
              ].map((p, i) => (
                <span
                  key={i}
                  className="absolute w-2 h-2 rounded-full animate-pulse"
                  style={{
                    left: `${p.x}%`, top: `${p.y}%`,
                    background: p.c,
                    boxShadow: `0 0 8px ${p.c}`,
                  }}
                />
              ))}

              <div className="absolute top-2 left-2 font-mono text-[9px] tracking-widest text-volunteer/70">
                RADAR · 250 m
              </div>
              <div className="absolute bottom-2 right-2 font-mono text-[9px] tracking-widest text-zinc-500">
                14 PINGS
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // AUTHORITY DASHBOARD — location-clustered zone cards
        // ───────────────────────────────────────────────────────────────
        function AuthorityDashboard({ session, signals, onOpenCluster }) {
          const counts = useMemo(() => ({
            total: signals.length,
            critical: signals.filter((s) => s.priority === 'CRITICAL' && s.status !== 'RESOLVED').length,
            inProgress: signals.filter((s) => s.status === 'IN_PROGRESS' || s.status === 'ACKNOWLEDGED').length,
            resolved: signals.filter((s) => s.status === 'RESOLVED').length,
          }), [signals]);

          // Enrich clusters with live signal objects.
          const clusters = useMemo(() =>
            MOCK_CLUSTERS.map((c) => {
              const clSignals = signals.filter((s) => c.signal_ids.includes(s.id));
              const priOrder = { CRITICAL: 0, HIGH: 1, NORMAL: 2, LOW: 3 };
              const topPriority = clSignals.reduce((best, s) =>
                (priOrder[s.priority] < priOrder[best]) ? s.priority : best, 'LOW');
              const totalPeople = clSignals.reduce((n, s) => n + (s.people_count || 0), 0);
              const unresolved = clSignals.filter((s) => s.status !== 'RESOLVED').length;
              return { ...c, clSignals, topPriority, totalPeople, unresolved };
            }), [signals]);

          return (
            <div className="px-3 pt-3 pb-28 space-y-5">
              <div className="px-1">
                <p className="font-mono text-[10px] tracking-widest text-zinc-500 mb-1">
                  AUTHORITY · COMMAND
                </p>
                <h1 className="text-xl font-bold text-zinc-100">Command Overview</h1>
                <p className="text-[13px] text-zinc-500 mt-1">
                  {counts.critical} critical · {clusters.length} active zones
                </p>
              </div>

              {/* Stat grid */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <StatTile icon={Radio}        label="Total Signals" value={counts.total}      accent="#a1a1aa" />
                <StatTile icon={Siren}        label="Critical"      value={counts.critical}   accent="#FF4D4D" />
                <StatTile icon={Activity}     label="In Progress"   value={counts.inProgress} accent="#58A6FF" />
                <StatTile icon={CheckCircle2} label="Resolved"      value={counts.resolved}   accent="#3FB950" />
              </div>

              {/* Quick actions */}
              <section>
                <SectionHeader icon={Zap} label="Quick Actions" />
                <div className="grid grid-cols-3 gap-2">
                  <QuickActionTile icon={Shield}        label="Safe Zone"      sub="Designate"  accent="#F78166" />
                  <QuickActionTile icon={ClipboardList} label="Resource Plan"  sub="Generate"   accent="#FFD43B" />
                  <QuickActionTile icon={Send}          label="Broadcast"      sub="All Roles"  accent="#58A6FF" />
                </div>
              </section>

              {/* Location zone clusters */}
              <section>
                <SectionHeader
                  icon={MapPin}
                  label="Signal Zones"
                  count={clusters.length}
                  suffix={
                    <span className="font-mono text-[10px] tracking-widest text-zinc-600">
                      GROUPED BY AREA
                    </span>
                  }
                />
                <div className="space-y-3">
                  {clusters.map((c) => (
                    <ClusterCard
                      key={c.id}
                      cluster={c}
                      onOpen={() => onOpenCluster(c.id)}
                    />
                  ))}
                </div>
              </section>
            </div>
          );
        }

        function QuickActionTile({ icon: Icon, label, sub, accent }) {
          return (
            <button
              className="flex flex-col items-start p-3 border bg-ink-900/60 active:scale-[0.97] transition text-left"
              style={{ borderColor: accent + '55' }}
            >
              <div
                className="w-9 h-9 mb-2 flex items-center justify-center rounded-sm"
                style={{ background: accent + '18', border: `1px solid ${accent}55`, color: accent }}
              >
                <Icon size={16} strokeWidth={2.2} />
              </div>
              <span className="text-[12px] font-medium text-zinc-100">{label}</span>
              <span className="font-mono text-[10px] tracking-widest text-zinc-500 mt-0.5">{sub}</span>
            </button>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // CLUSTER CARD (authority zone card)
        // ───────────────────────────────────────────────────────────────
        function ClusterCard({ cluster, onOpen }) {
          const { label, sublabel, radius_m, clSignals, topPriority, totalPeople, unresolved } = cluster;
          const priMeta = PRIORITY_META[topPriority];
          const [gemmaOpen, setGemmaOpen] = useState(false);
          const [gemmaLoading, setGemmaLoading] = useState(false);
          const [gemmaResult, setGemmaResult] = useState(null);

          // Aggregate category counts
          const catCounts = clSignals.reduce((acc, s) => {
            acc[s.category] = (acc[s.category] || 0) + 1;
            return acc;
          }, {});

          const triggerGemma = (e) => {
            e.stopPropagation();
            setGemmaOpen(true);
            if (gemmaResult) return;
            setGemmaLoading(true);
            setTimeout(() => {
              setGemmaLoading(false);
              setGemmaResult({
                sitrep: `${unresolved} unresolved signal${unresolved !== 1 ? 's' : ''} within ${radius_m}m. Dominant need: ${Object.keys(catCounts)[0]}.`,
                recommendation: clSignals.map((s) =>
                  `• ${s.priority} — ${s.summary || s.message.slice(0, 55)}${s.message.length > 55 ? '…' : ''}`
                ).join('\n'),
                action: `Mark ${unresolved} ticket${unresolved !== 1 ? 's' : ''} as Acknowledged and assign closest volunteer unit.`,
              });
            }, 1400);
          };

          return (
            <div
              className="bg-ink-900/70 border border-zinc-800 overflow-hidden"
              style={{ borderLeftColor: priMeta.color, borderLeftWidth: 3 }}
            >
              {/* Header row */}
              <div className="flex items-start gap-3 p-3">
                <div
                  className="w-10 h-10 shrink-0 flex items-center justify-center rounded-sm mt-0.5"
                  style={{ background: priMeta.color + '14', border: `1px solid ${priMeta.color}44`, color: priMeta.color }}
                >
                  <MapPin size={16} strokeWidth={2.2} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-[14px] text-zinc-100 font-semibold leading-tight">{label}</div>
                  <div className="font-mono text-[10px] tracking-widest text-zinc-500 mt-0.5">{sublabel}</div>
                  {/* Category chips */}
                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {Object.entries(catCounts).map(([cat, n]) => {
                      const m = CATEGORY_META[cat];
                      const I = m.icon;
                      return (
                        <span
                          key={cat}
                          className="inline-flex items-center gap-1 px-1.5 py-0.5 text-[10px] font-mono tracking-widest"
                          style={{ color: m.color, background: m.color + '14', border: `1px solid ${m.color}33` }}
                        >
                          <I size={10} strokeWidth={2.4} /> {n} {cat}
                        </span>
                      );
                    })}
                  </div>
                </div>
                {/* Signal count badge */}
                <div className="text-right shrink-0">
                  <div className="font-mono text-xl font-bold leading-none" style={{ color: priMeta.color }}>
                    {unresolved}
                  </div>
                  <div className="font-mono text-[9px] tracking-widest text-zinc-500 mt-0.5">OPEN</div>
                </div>
              </div>

              {/* Aggregate stats strip */}
              <div className="flex items-center gap-4 px-3 pb-2 font-mono text-[10px] tracking-widest text-zinc-500">
                <span className="flex items-center gap-1">
                  <Users size={10} /> {totalPeople} ppl
                </span>
                <span className="flex items-center gap-1">
                  <Radio size={10} /> {clSignals.length} signal{clSignals.length !== 1 ? 's' : ''}
                </span>
                <span style={{ color: priMeta.color }} className="flex items-center gap-1">
                  <PriorityDot priority={topPriority} /> {priMeta.label}
                </span>
              </div>

              {/* Gemma result inline */}
              {gemmaOpen && (
                <div
                  className="mx-3 mb-3 border p-3 bg-ink-950/60"
                  style={{ borderColor: '#58A6FF44' }}
                >
                  <div className="flex items-center gap-2 mb-2">
                    <Bot size={12} className="text-civilian" />
                    <span className="font-mono text-[10px] tracking-widest text-civilian">GEMMA ZONE SITREP</span>
                    <button onClick={() => setGemmaOpen(false)} className="ml-auto text-zinc-500 hover:text-zinc-200">
                      <X size={12} />
                    </button>
                  </div>
                  {gemmaLoading ? (
                    <div className="flex items-center gap-2 font-mono text-[11px] text-zinc-400 py-2">
                      <Loader2 size={13} className="animate-spin text-civilian" />
                      Analysing {clSignals.length} signals…
                    </div>
                  ) : gemmaResult && (
                    <>
                      <p className="text-[12px] text-zinc-200 leading-relaxed mb-2">{gemmaResult.sitrep}</p>
                      <pre className="font-mono text-[11px] text-zinc-400 whitespace-pre-wrap leading-relaxed mb-3">
                        {gemmaResult.recommendation}
                      </pre>
                      <div className="border border-volunteer/40 bg-volunteer/[0.07] p-2 font-mono text-[11px] text-volunteer/90 mb-3">
                        ⟶ {gemmaResult.action}
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => setGemmaOpen(false)}
                          className="py-2 border border-volunteer text-volunteer font-mono text-[10px] tracking-widest hover:bg-volunteer/15 transition"
                        >
                          ACCEPT ALL
                        </button>
                        <button
                          onClick={() => { setGemmaOpen(false); onOpen(); }}
                          className="py-2 border border-zinc-700 text-zinc-300 font-mono text-[10px] tracking-widest hover:bg-zinc-800 transition"
                        >
                          REVIEW EACH
                        </button>
                      </div>
                    </>
                  )}
                </div>
              )}

              {/* Action row */}
              <div className="grid grid-cols-2 border-t border-zinc-800 divide-x divide-zinc-800">
                <button
                  onClick={triggerGemma}
                  className="flex items-center justify-center gap-1.5 py-2.5 font-mono text-[10px] tracking-widest text-civilian hover:bg-civilian/10 transition"
                >
                  <Sparkles size={11} strokeWidth={2.4} />
                  RESOLVE VIA GEMMA
                </button>
                <button
                  onClick={onOpen}
                  className="flex items-center justify-center gap-1.5 py-2.5 font-mono text-[10px] tracking-widest text-authority hover:bg-authority/10 transition"
                >
                  OPEN ZONE <ChevronRight size={11} />
                </button>
              </div>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // ZONE DASHBOARD (authority drills into a cluster)
        // ───────────────────────────────────────────────────────────────
        function ZoneDashboard({ cluster, signals, onBack, onOpenSignal, aiState }) {
          const { label, sublabel, topPriority, totalPeople, unresolved } = cluster;
          const priMeta = PRIORITY_META[topPriority];
          const [gemmaAnalysing, setGemmaAnalysing] = useState(false);
          const [gemmaResult, setGemmaResult] = useState(null);

          const runGemma = () => {
            if (gemmaResult || gemmaAnalysing) return;
            setGemmaAnalysing(true);
            setTimeout(() => {
              setGemmaAnalysing(false);
              setGemmaResult({
                sitrep: `${unresolved} open signal${unresolved !== 1 ? 's' : ''} across ${label}. ${totalPeople} people at risk.`,
                plan: signals.map((s, i) =>
                  `${i + 1}. [${s.priority}] ${s.summary || s.message.slice(0, 60)}${s.message.length > 60 ? '…' : ''}`
                ).join('\n'),
                action: 'Recommend dispatching paramedic unit to highest-priority location first, then routing supply volunteer to secondary sites.',
              });
            }, 1800);
          };

          return (
            <div className="pb-28">
              {/* In-screen App bar for sub-screen */}
              <div className="sticky top-0 z-10 bg-ink-950/95 backdrop-blur border-b border-zinc-900 flex items-center gap-2 px-3 py-3">
                <button onClick={onBack} className="p-1 -ml-1 text-zinc-400 hover:text-zinc-100">
                  <ArrowLeft size={16} />
                </button>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold text-zinc-100 truncate">{label}</div>
                  <div className="font-mono text-[9px] tracking-widest text-zinc-500">{sublabel}</div>
                </div>
                <span
                  className="font-mono text-[10px] tracking-widest px-1.5 py-0.5 border"
                  style={{ color: priMeta.color, borderColor: priMeta.color + '55' }}
                >
                  {priMeta.label}
                </span>
              </div>

              <div className="px-3 pt-4 space-y-4">
                {/* Zone stat strip */}
                <div className="grid grid-cols-3 gap-2">
                  <StatTile icon={Radio}        label="Total"    value={signals.length}  accent="#a1a1aa" />
                  <StatTile icon={Siren}        label="Open"     value={unresolved}       accent={priMeta.color} />
                  <StatTile icon={Users}        label="Affected" value={totalPeople || '—'} accent="#58A6FF" />
                </div>

                {/* Gemma batch resolve */}
                <div className="border border-civilian/40 bg-civilian/[0.05] overflow-hidden">
                  <button
                    onClick={runGemma}
                    disabled={!!gemmaResult || gemmaAnalysing}
                    className="w-full flex items-center gap-3 p-3.5 hover:bg-civilian/[0.08] transition disabled:opacity-80"
                  >
                    <div className="w-10 h-10 flex items-center justify-center bg-civilian/15 border border-civilian/60 text-civilian shrink-0">
                      {gemmaAnalysing
                        ? <Loader2 size={18} className="animate-spin" strokeWidth={2.2} />
                        : <Sparkles size={18} strokeWidth={2.2} />
                      }
                    </div>
                    <div className="flex-1 text-left">
                      <div className="text-sm font-medium text-zinc-100">
                        {gemmaResult ? 'Gemma Analysis' : 'Resolve All via Gemma'}
                      </div>
                      <p className="text-[12px] text-zinc-400 mt-0.5">
                        {gemmaAnalysing
                          ? 'Gemma is analysing this zone…'
                          : gemmaResult
                            ? 'Tap to review the SITREP'
                            : `Batch analyse ${signals.length} signals, generate action plan`
                        }
                      </p>
                    </div>
                    {!gemmaAnalysing && !gemmaResult && (
                      <ChevronRight size={14} className="text-civilian/60 shrink-0" />
                    )}
                  </button>

                  {/* Gemma output */}
                  {gemmaResult && (
                    <div className="border-t border-civilian/30 p-3.5 space-y-3">
                      <p className="text-[13px] text-zinc-200 leading-relaxed">{gemmaResult.sitrep}</p>
                      <pre className="font-mono text-[11px] text-zinc-400 whitespace-pre-wrap leading-relaxed bg-ink-950/60 p-2 border border-zinc-800">
                        {gemmaResult.plan}
                      </pre>
                      <div className="border border-volunteer/40 bg-volunteer/[0.07] p-2.5 font-mono text-[11px] text-volunteer/90">
                        ⟶ {gemmaResult.action}
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button className="py-2.5 border border-volunteer text-volunteer font-mono text-[10px] tracking-widest hover:bg-volunteer/15 transition">
                          ACCEPT PLAN
                        </button>
                        <button className="py-2.5 border border-zinc-700 text-zinc-300 font-mono text-[10px] tracking-widest hover:bg-zinc-800 transition">
                          EDIT PLAN
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                {/* Individual tickets */}
                <section>
                  <SectionHeader icon={Siren} label="Zone Tickets" count={signals.length} />
                  <div className="space-y-2">
                    {signals.map((s) => (
                      <ZoneTicketCard key={s.id} signal={s} onOpen={() => onOpenSignal(s.id)} />
                    ))}
                  </div>
                </section>
              </div>
            </div>
          );
        }

        function ZoneTicketCard({ signal, onOpen }) {
          const cat = CATEGORY_META[signal.category];
          const pri = PRIORITY_META[signal.priority];
          const Icon = cat.icon;
          const [localStatus, setLocalStatus] = useState(signal.status);

          return (
            <div
              className="bg-ink-900/70 border border-zinc-800 overflow-hidden"
              style={{ borderLeftColor: pri.color, borderLeftWidth: 3 }}
            >
              <button
                onClick={onOpen}
                className="w-full text-left flex items-start gap-3 p-3 hover:bg-ink-800/50 transition"
              >
                <div
                  className="w-9 h-9 shrink-0 flex items-center justify-center rounded-sm"
                  style={{ background: cat.color + '14', border: `1px solid ${cat.color}44`, color: cat.color }}
                >
                  <Icon size={15} strokeWidth={2.2} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1 flex-wrap">
                    <CategoryChip category={signal.category} />
                    <StatusPill status={localStatus} />
                    <span className="ml-auto font-mono text-[10px] text-zinc-500">{timeAgo(signal.created_at)}</span>
                  </div>
                  <p className="text-[13px] text-zinc-200 leading-snug line-clamp-2">
                    {signal.summary || signal.message}
                  </p>
                  {signal.people_count > 0 && (
                    <span className="font-mono text-[10px] text-zinc-500 mt-1 flex items-center gap-1">
                      <Users size={10} /> {signal.people_count} ppl · {signal.manual_location || '—'}
                    </span>
                  )}
                </div>
              </button>
              {/* Per-ticket actions: Acknowledge + Resolve only */}
              {localStatus !== 'RESOLVED' && (
                <div className="grid grid-cols-2 border-t border-zinc-800 divide-x divide-zinc-800">
                  <button
                    onClick={() => setLocalStatus('ACKNOWLEDGED')}
                    className={cx(
                      'flex items-center justify-center gap-1.5 py-2 font-mono text-[10px] tracking-widest transition',
                      localStatus === 'ACKNOWLEDGED'
                        ? 'text-high bg-high/10'
                        : 'text-zinc-400 hover:text-high hover:bg-high/10'
                    )}
                  >
                    <CheckCircle2 size={11} strokeWidth={2.4} /> ACK
                  </button>
                  <button
                    onClick={() => setLocalStatus('RESOLVED')}
                    className="flex items-center justify-center gap-1.5 py-2 font-mono text-[10px] tracking-widest text-zinc-400 hover:text-volunteer hover:bg-volunteer/10 transition"
                  >
                    <Flag size={11} strokeWidth={2.4} /> RESOLVE
                  </button>
                </div>
              )}
              {localStatus === 'RESOLVED' && (
                <div className="flex items-center justify-center gap-2 py-2 font-mono text-[10px] tracking-widest text-volunteer/70 border-t border-zinc-800">
                  <CheckCircle2 size={11} strokeWidth={2.4} /> RESOLVED
                </div>
              )}
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // MAP SCREEN
        // ───────────────────────────────────────────────────────────────
        function MapScreen({ session, onOpenSignal }) {
          const role = session.role;
          const [selected, setSelected] = useState(null);

          // Visibility rules per role
          const visiblePins = useMemo(() => MAP_PINS.filter((p) => {
            if (role === 'CIVILIAN') {
              // sees safe zones + authority pins; NOT other civilians' signals
              return p.kind === 'safezone' || p.kind === 'authority';
            }
            if (role === 'VOLUNTEER') {
              return p.kind === 'signal' || p.kind === 'safezone' || p.kind === 'authority' || p.kind === 'volunteer';
            }
            // AUTHORITY: everything
            return true;
          }), [role]);

          return (
            <div className="relative h-[calc(100vh-3rem-3rem)] overflow-hidden bg-ink-950">
              {/* Map canvas */}
              <div className="absolute inset-0 grid-bg">
                {/* Crosshair grid overlays */}
                <div className="absolute inset-0">
                  <span className="absolute top-1/2 left-0 right-0 h-px bg-zinc-800/60" />
                  <span className="absolute top-0 bottom-0 left-1/2 w-px bg-zinc-800/60" />
                  {/* concentric tactical rings around centre */}
                  {[1, 2, 3, 4].map((r) => (
                    <span
                      key={r}
                      className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 border border-zinc-800/40 rounded-full"
                      style={{ width: `${r * 22}%`, height: `${r * 22}%` }}
                    />
                  ))}
                </div>

                {/* Pins */}
                {visiblePins.map((p) => {
                  let color = '#a1a1aa', PinIcon = MapPin;
                  if (p.kind === 'signal') {
                    color = PRIORITY_META[p.priority].color;
                    PinIcon = CATEGORY_META[p.category].icon;
                  } else if (p.kind === 'safezone') {
                    color = '#3FB950'; PinIcon = Tent;
                  } else if (p.kind === 'authority') {
                    color = '#F78166'; PinIcon = Shield;
                  } else if (p.kind === 'volunteer') {
                    color = '#58A6FF'; PinIcon = LifeBuoy;
                  }
                  const isSelected = selected?.id === p.id;
                  return (
                    <button
                      key={p.id}
                      onClick={() => setSelected(p)}
                      className="absolute -translate-x-1/2 -translate-y-1/2 group"
                      style={{ left: `${p.x}%`, top: `${p.y}%` }}
                    >
                      {(p.kind === 'signal' && (p.priority === 'CRITICAL' || p.priority === 'HIGH')) && (
                        <span
                          className="absolute inset-0 -m-2 rounded-full animate-ping"
                          style={{ background: color + '33' }}
                        />
                      )}
                      <span
                        className={cx(
                          'relative flex items-center justify-center w-7 h-7 rounded-sm border-2 transition',
                          isSelected ? 'scale-110' : ''
                        )}
                        style={{
                          background: color + '22',
                          borderColor: color,
                          color,
                          boxShadow: isSelected ? `0 0 16px ${color}` : `0 0 8px ${color}55`,
                        }}
                      >
                        <PinIcon size={13} strokeWidth={2.4} />
                      </span>
                    </button>
                  );
                })}

                {/* Self marker (centre-ish) */}
                <div className="absolute left-[52%] top-[48%] -translate-x-1/2 -translate-y-1/2">
                  <span className="absolute inset-0 -m-3 rounded-full bg-civilian/20 animate-ping" />
                  <span className="relative block w-3 h-3 rounded-full bg-civilian ring-2 ring-ink-950" />
                </div>
              </div>

              {/* Top tactical overlay */}
              <div className="absolute top-0 inset-x-0 p-3 flex items-start justify-between pointer-events-none">
                <div className="font-mono text-[10px] tracking-widest text-zinc-400 bg-ink-950/80 border border-zinc-800 px-2 py-1 pointer-events-auto">
                  <div className="flex items-center gap-1.5">
                    <Crosshair size={11} strokeWidth={2.2} />
                    GRID 28.61°N 77.21°E
                  </div>
                  <div className="text-zinc-600 mt-0.5">ZOOM 14 · OSM CACHE 92%</div>
                </div>
                <div className="flex flex-col gap-1.5 pointer-events-auto">
                  <button className="w-9 h-9 flex items-center justify-center bg-ink-950/80 border border-zinc-800 text-zinc-300 hover:bg-ink-800">
                    <Layers size={14} />
                  </button>
                  <button className="w-9 h-9 flex items-center justify-center bg-ink-950/80 border border-zinc-800 text-zinc-300 hover:bg-ink-800">
                    <Navigation size={14} />
                  </button>
                </div>
              </div>

              {/* Visibility legend */}
              <div className="absolute top-20 left-3 bg-ink-950/85 border border-zinc-800 p-2 max-w-[180px] pointer-events-auto">
                <div className="font-mono text-[9px] tracking-widest text-zinc-500 mb-1.5 flex items-center gap-1">
                  <Lock size={9} /> VISIBILITY · {ROLES[role].badge}
                </div>
                <div className="space-y-1 font-mono text-[10px] text-zinc-300">
                  {role === 'CIVILIAN' && (
                    <>
                      <LegendRow icon={Tent}   color="#3FB950" label="Safe zones" />
                      <LegendRow icon={Shield} color="#F78166" label="Authority units" />
                      <LegendRow icon={Siren}  color="#71717a" label="Signals hidden" muted />
                    </>
                  )}
                  {role === 'VOLUNTEER' && (
                    <>
                      <LegendRow icon={Siren}   color="#FF4D4D" label="Distress signals" />
                      <LegendRow icon={Tent}    color="#3FB950" label="Safe zones" />
                      <LegendRow icon={Shield}  color="#F78166" label="Authority" />
                      <LegendRow icon={LifeBuoy} color="#58A6FF" label="Other volunteers" />
                    </>
                  )}
                  {role === 'AUTHORITY' && (
                    <>
                      <LegendRow icon={Siren}    color="#FF4D4D" label="All signals" />
                      <LegendRow icon={Tent}     color="#3FB950" label="Safe zones" />
                      <LegendRow icon={LifeBuoy} color="#58A6FF" label="Volunteers" />
                      <LegendRow icon={Users}    color="#a1a1aa" label="Civilians" />
                    </>
                  )}
                </div>
              </div>

              {/* Bottom selection sheet */}
              {selected && (
                <div className="absolute inset-x-0 bottom-0 bg-ink-900/95 backdrop-blur border-t border-zinc-800 p-3 pointer-events-auto">
                  <div className="flex items-start gap-3">
                    <div
                      className="w-10 h-10 flex items-center justify-center"
                      style={{
                        background: (selected.kind === 'signal' ? PRIORITY_META[selected.priority].color
                          : selected.kind === 'safezone' ? '#3FB950'
                            : selected.kind === 'authority' ? '#F78166' : '#58A6FF') + '18',
                        border: `1px solid ${selected.kind === 'signal' ? PRIORITY_META[selected.priority].color
                          : selected.kind === 'safezone' ? '#3FB950'
                            : selected.kind === 'authority' ? '#F78166' : '#58A6FF'}55`,
                      }}
                    >
                      {selected.kind === 'signal' && (() => { const I = CATEGORY_META[selected.category].icon; return <I size={16} style={{ color: CATEGORY_META[selected.category].color }} />; })()}
                      {selected.kind === 'safezone'  && <Tent size={16} className="text-volunteer" />}
                      {selected.kind === 'authority' && <Shield size={16} className="text-authority" />}
                      {selected.kind === 'volunteer' && <LifeBuoy size={16} className="text-civilian" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-mono text-[10px] tracking-widest text-zinc-500 uppercase">
                          {selected.kind === 'safezone' ? selected.zoneType : selected.kind}
                        </span>
                        {selected.kind === 'signal' && <CategoryChip category={selected.category} />}
                        {selected.kind === 'signal' && (
                          <span className="font-mono text-[10px] tracking-widest" style={{ color: PRIORITY_META[selected.priority].color }}>
                            {PRIORITY_META[selected.priority].label}
                          </span>
                        )}
                      </div>
                      <div className="text-sm text-zinc-100 mt-1 font-medium">{selected.label}</div>
                      <div className="mt-1.5 flex gap-2">
                        {selected.kind === 'signal' && (
                          <button
                            onClick={() => onOpenSignal(selected.id)}
                            className="px-3 py-1 border border-civilian/60 text-civilian font-mono text-[10px] tracking-widest hover:bg-civilian/15"
                          >
                            VIEW DETAIL
                          </button>
                        )}
                        <button className="px-3 py-1 border border-zinc-700 text-zinc-300 font-mono text-[10px] tracking-widest hover:bg-zinc-800">
                          NAVIGATE
                        </button>
                      </div>
                    </div>
                    <button onClick={() => setSelected(null)} className="text-zinc-500 hover:text-zinc-200 -m-1 p-1">
                      <X size={16} />
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function LegendRow({ icon: Icon, color, label, muted }) {
          return (
            <div className={cx('flex items-center gap-1.5', muted && 'opacity-40')}>
              <Icon size={11} style={{ color }} strokeWidth={2.4} />
              <span className="text-zinc-300">{label}</span>
            </div>
          );
        }

        // ───────────────────────────────────────────────────────────────
        // ASSISTANT SCREEN
        // ───────────────────────────────────────────────────────────────
        function AssistantScreen({ aiState, onDownload, session }) {
          const [input, setInput] = useState('');
          const [history, setHistory] = useState([
            {
              role: 'assistant',
              text: 'I run entirely on this device. Ask me anything about first-aid, shelter, or staying safe during an emergency.',
              meta: 'BOOT · OFFLINE',
            },
          ]);
          const [thinking, setThinking] = useState(false);
          const scrollRef = useRef(null);

          useEffect(() => {
            scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior: 'smooth' });
          }, [history, thinking]);

          const send = () => {
            const q = input.trim();
            if (!q || aiState.status !== 'ready') return;
            setHistory((h) => [...h, { role: 'user', text: q }]);
            setInput('');
            setThinking(true);
            setTimeout(() => {
              setHistory((h) => [...h, {
                role: 'assistant',
                text: mockAnswer(q),
                meta: 'RAG · emergency_kb.json · 240 ms',
              }]);
              setThinking(false);
            }, 1100);
          };

          const SAMPLE_PROMPTS = [
            'How do I treat a deep cut?',
            'Safe shelter during aftershock?',
            'Make water drinkable',
            'CPR on a child',
          ];

          return (
            <div className="flex flex-col h-[calc(100vh-3rem-3rem)]">
              {/* Header strip */}
              <div className="px-3 py-3 border-b border-zinc-900 flex items-center gap-2.5">
                <div className="w-9 h-9 flex items-center justify-center bg-civilian/15 border border-civilian/60 text-civilian">
                  <Bot size={16} strokeWidth={2.2} />
                </div>
                <div className="flex-1">
                  <div className="text-sm text-zinc-100 font-medium">Survival Assistant</div>
                  <div className="font-mono text-[10px] tracking-widest text-zinc-500">
                    GEMMA 3N E2B · ON-DEVICE
                  </div>
                </div>
                <span
                  className="font-mono text-[10px] tracking-widest px-1.5 py-0.5 border"
                  style={{
                    color: aiState.status === 'ready' ? '#3FB950' : '#71717a',
                    borderColor: (aiState.status === 'ready' ? '#3FB950' : '#71717a') + '55',
                  }}
                >
                  {aiState.status === 'ready' ? 'READY' : aiState.status.toUpperCase()}
                </span>
              </div>

              {/* Body */}
              <div ref={scrollRef} className="flex-1 overflow-y-auto px-3 py-4 space-y-3">
                {aiState.status !== 'ready' && (
                  <div className="border border-civilian/40 bg-civilian/[0.06] p-3.5">
                    <div className="flex items-start gap-3">
                      <Download size={16} className="text-civilian mt-0.5" />
                      <div className="flex-1">
                        <div className="text-sm text-zinc-100 font-medium">Model not installed</div>
                        <p className="text-[12px] text-zinc-400 mt-0.5">
                          Survival answers need the on-device Gemma model. Download once (3 GB),
                          ideally over Wi-Fi, <span className="text-civilian">before</span> the mesh-only phase.
                        </p>
                        {aiState.status === 'absent' && (
                          <button
                            onClick={onDownload}
                            className="mt-3 inline-flex items-center gap-2 px-3 py-2 bg-civilian/15 border border-civilian text-civilian font-mono text-[11px] tracking-widest hover:bg-civilian/25"
                          >
                            <Download size={12} strokeWidth={2.4} /> DOWNLOAD NOW
                          </button>
                        )}
                        {aiState.status === 'downloading' && (
                          <div className="mt-3">
                            <div className="h-1.5 bg-zinc-800 mb-1">
                              <div className="h-full bg-civilian" style={{ width: `${aiState.progress}%` }} />
                            </div>
                            <div className="font-mono text-[10px] tracking-widest text-civilian">
                              {aiState.progress.toFixed(1)}% · {aiState.downloadedMb} / {aiState.sizeMb} MB
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {history.map((msg, i) => (
                  <ChatBubble key={i} msg={msg} />
                ))}
                {thinking && (
                  <div className="flex items-center gap-2 pl-9 font-mono text-[10px] tracking-widest text-zinc-500">
                    <Loader2 size={12} className="animate-spin" />
                    Gemma is thinking…
                  </div>
                )}
              </div>

              {/* Suggestions */}
              {aiState.status === 'ready' && history.length < 3 && (
                <div className="px-3 pb-2 flex gap-2 overflow-x-auto">
                  {SAMPLE_PROMPTS.map((p) => (
                    <button
                      key={p}
                      onClick={() => setInput(p)}
                      className="shrink-0 px-2.5 py-1.5 border border-zinc-800 hover:border-civilian/60 font-mono text-[10px] tracking-widest text-zinc-300 whitespace-nowrap"
                    >
                      {p}
                    </button>
                  ))}
                </div>
              )}

              {/* Composer */}
              <div className="border-t border-zinc-900 p-2.5">
                <div className="flex items-center gap-2 bg-ink-900 border border-zinc-800 focus-within:border-civilian/60 px-2">
                  <input
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && send()}
                    placeholder={aiState.status === 'ready' ? 'Ask Gemma…' : 'Download the model to start chatting'}
                    disabled={aiState.status !== 'ready'}
                    className="flex-1 bg-transparent py-2.5 px-1 text-sm text-zinc-100 placeholder:text-zinc-600 outline-none disabled:opacity-50"
                  />
                  <button
                    onClick={send}
                    disabled={aiState.status !== 'ready' || !input.trim()}
                    className="p-1.5 text-civilian disabled:text-zinc-700"
                  >
                    <Send size={16} strokeWidth={2.2} />
                  </button>
                </div>
                <p className="mt-1.5 font-mono text-[9px] tracking-widest text-zinc-600 text-center">
                  RUNS ON YOUR DEVICE · NO INTERNET REQUIRED
                </p>
              </div>
            </div>
          );
        }

        function ChatBubble({ msg }) {
          if (msg.role === 'user') {
            return (
              <div className="flex justify-end">
                <div className="max-w-[80%] bg-civilian/15 border border-civilian/40 text-zinc-100 text-[13px] px-3 py-2 rounded-sm leading-relaxed">
                  {msg.text}
                </div>
              </div>
            );
          }
          return (
            <div className="flex items-start gap-2.5">
              <div className="w-7 h-7 mt-0.5 flex items-center justify-center bg-ink-800 border border-zinc-800 shrink-0">
                <Bot size={13} className="text-zinc-300" />
              </div>
              <div className="flex-1">
                <div className="bg-ink-900/60 border border-zinc-800 text-zinc-200 text-[13px] px-3 py-2 rounded-sm leading-relaxed whitespace-pre-wrap">
                  {msg.text}
                </div>
                {msg.meta && (
                  <div className="font-mono text-[9px] tracking-widest text-zinc-600 mt-1">
                    {msg.meta}
                  </div>
                )}
              </div>
            </div>
          );
        }

        function mockAnswer(q) {
          const l = q.toLowerCase();
          if (l.includes('cut') || l.includes('bleed')) {
            return [
              '1. Apply firm pressure with the cleanest cloth you have for at least 10 minutes — do not lift to peek.',
              '2. Elevate the injured area above the heart if possible.',
              '3. If blood soaks through, add another layer on top — never remove the first.',
              '4. Once bleeding slows, rinse with clean water and cover loosely.',
              '',
              'Seek help if bleeding does not slow in 15 min, the cut is deeper than the skin layer, or it was caused by a rusty/dirty object.',
            ].join('\n');
          }
          if (l.includes('aftershock') || l.includes('quake')) {
            return [
              'During an aftershock, DROP – COVER – HOLD ON.',
              'Get under a sturdy table; protect your head and neck. Stay away from windows and external walls.',
              'If you’re outdoors, move to an open area away from buildings and power lines.',
            ].join('\n');
          }
          if (l.includes('water') || l.includes('drink')) {
            return [
              'To make water safer to drink:',
              '• Filter through a clean cloth to remove debris.',
              '• Boil for at least 1 minute (3 minutes above 2000 m).',
              '• If boiling isn’t possible, use chlorine drops (8 drops of 5% unscented bleach per gallon) and wait 30 min.',
            ].join('\n');
          }
          return 'I’d normally pull from the bundled emergency knowledge base and run Gemma locally for a grounded answer. This is a UI shell — the real assistant ships in Phase 4 (see SYSTEM_KNOWLEDGE §8).';
        }

        // ───────────────────────────────────────────────────────────────
        // SIGNAL DETAIL OVERLAY
        // ───────────────────────────────────────────────────────────────
        function SignalDetail({ signal, role, onClose }) {
          if (!signal) return null;
          const cat = CATEGORY_META[signal.category];
          const pri = PRIORITY_META[signal.priority];
          const Icon = cat.icon;
          const canAct = role === 'VOLUNTEER' || role === 'AUTHORITY';

          return (
            <div className="fixed inset-0 z-40 bg-black/70 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="w-full sm:max-w-md bg-ink-900 border-t sm:border border-zinc-800 max-h-[88vh] overflow-y-auto">
                <div className="sticky top-0 bg-ink-900/95 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center gap-2">
                  <button onClick={onClose} className="-m-1 p-1 text-zinc-400 hover:text-zinc-100">
                    <ArrowLeft size={16} />
                  </button>
                  <span className="font-mono text-[10px] tracking-widest text-zinc-500">
                    SIGNAL · {signal.id.toUpperCase()}
                  </span>
                  <span className="ml-auto"><StatusPill status={signal.status} /></span>
                </div>

                <div className="p-4 space-y-4">
                  {/* Banner */}
                  <div
                    className="p-3 border relative overflow-hidden"
                    style={{ borderColor: pri.color + '55', background: pri.color + '0e' }}
                  >
                    <div className="flex items-center gap-2 mb-2">
                      <CategoryChip category={signal.category} />
                      <span
                        className="font-mono text-[10px] tracking-widest"
                        style={{ color: pri.color }}
                      >
                        {pri.label}
                      </span>
                    </div>
                    <p className="text-[14px] text-zinc-100 leading-relaxed">{signal.message}</p>
                    {signal.summary && (
                      <p className="mt-2 pt-2 border-t border-zinc-800 font-mono text-[10px] tracking-widest text-zinc-500">
                        <span className="text-civilian">AI SITREP · </span>
                        <span className="text-zinc-300 normal-case">{signal.summary}</span>
                      </p>
                    )}
                  </div>

                  {/* Meta */}
                  <div className="grid grid-cols-2 gap-2 text-[12px]">
                    <Detail label="FROM" value={signal.sender_name} />
                    <Detail label="ROLE" value={signal.sender_role} />
                    <Detail label="LOCATION" value={signal.manual_location || '—'} />
                    <Detail label="PEOPLE" value={signal.people_count || '—'} />
                    <Detail label="CREATED" value={new Date(signal.created_at).toLocaleTimeString()} />
                    <Detail label="MESH HOP" value={`${signal.hop_count}/${signal.ttl}`} />
                  </div>

                  {signal.needs?.length > 0 && (
                    <div>
                      <div className="font-mono text-[10px] tracking-widest text-zinc-500 mb-1.5">NEEDS</div>
                      <div className="flex flex-wrap gap-1.5">
                        {signal.needs.map((n) => (
                          <span key={n} className="font-mono text-[10px] tracking-widest text-zinc-200 border border-zinc-700 px-1.5 py-0.5">

          const [signals, setSignals] = useState(MOCK_SIGNALS);
          const [tasks] = useState(MOCK_TASKS);
          const [peerCount] = useState(MOCK_PEERS_COUNT);
          const [battery] = useState(78);
          const [aiState, setAiState] = useState({
            status: 'absent', progress: 0, sizeMb: 2940, downloadedMb: 0,
          });
          const [aiPanelOpen, setAiPanelOpen] = useState(false);
          const [composeCategory, setComposeCategory] = useState(null);
          const [openSignalId, setOpenSignalId] = useState(null);

            clearInterval(downloadTimer.current);
            downloadTimer.current = setInterval(() => {
              setAiState((s) => {
                if (s.status !== 'downloading') return s;
                const next = Math.min(100, s.progress + Math.random() * 6 + 2);
                const dmb = Math.round((next / 100) * s.sizeMb);
                if (next >= 100) {
                  clearInterval(downloadTimer.current);
                  setTimeout(() => setAiState((x) => ({ ...x, status: 'verifying' })), 200);
                  setTimeout(() => setAiState((x) => ({ ...x, status: 'ready' })), 2000);
                }
                return { ...s, progress: next, downloadedMb: dmb };
              });
            }, 320);
          };

          const cancelDownload = () => {
            clearInterval(downloadTimer.current);
            setAiState((s) => ({ ...s, status: 'absent', progress: 0, downloadedMb: 0 }));
          };

          useEffect(() => () => clearInterval(downloadTimer.current), []);

          const openSignal = useCallback((id) => setOpenSignalId(id), []);
          const openSignalObj = openSignalId ? signals.find((s) => s.id === openSignalId) : null;

          const submitSignal = ({ category, message, people }) => {
            // Civilian does NOT pick priority. Mock Layer-1 keyword triage infers it.
            const lc = message.toLowerCase();
            const inferredPriority =
              /unconscious|not breathing|drown|severe|bleed|critical|trapped|labour/.test(lc) ? 'CRITICAL' :
              /injur|fever|hurt|fire|water rising|stuck/.test(lc) ? 'HIGH' :
              /food|water|shelter|info/.test(lc) ? 'NORMAL' : 'HIGH';

            const s = {
              id: 'sig-' + Math.random().toString(36).slice(2, 8),
              sender_node_id: 'node-self',
              sender_name: session.name,
              sender_role: session.role,
              category,
              priority: inferredPriority,
              message,
              summary: aiState.status === 'ready'
                ? message.slice(0, 60) + (message.length > 60 ? '…' : '')
                : null,
              needs: [],
              people_count: people ? parseInt(people, 10) : 0,
              area: 'Your Location', area_id: 'area-self',
              latitude: 28.6121, longitude: 77.2103,
              manual_location: 'Auto-fetched (28.6121° N, 77.2103° E)',
              status: 'NEW',
              hop_count: 0, ttl: 8,
              created_at: Date.now(), updated_at: Date.now(),
            };
            setSignals((prev) => [s, ...prev]);
            setComposeCategory(null);
            setTab('home');
          };

          // Login first
          if (!session) {
            return <LoginScreen onContinue={setSession} />;
          }

          // Main screens
          let body;
          if (tab === 'home') {
            if (session.role === 'CIVILIAN') {
              body = (
                <CivilianDashboard
                  session={session}
                  signals={signals}
                  aiState={aiState}
                  onRaise={(cat) => setComposeCategory(cat)}
                  onOpenAssistant={() => {
                    if (aiState.status === 'absent') setAiPanelOpen(true);
                    setTab('assistant');
                  }}
                  onOpenSignal={openSignal}
                />
              );
            } else if (session.role === 'VOLUNTEER') {
              body = (
                <VolunteerDashboard
                  session={session}
                  tasks={tasks}
                  signals={signals}
                  onOpenTask={(id) => alert('Task ' + id)}
                  onOpenSignal={openSignal}
                  onGoMap={() => setTab('map')}
                />
              );
            } else {
              if (openClusterId) {
                const cluster = MOCK_CLUSTERS.find((c) => c.id === openClusterId);
                const priOrder = { CRITICAL: 0, HIGH: 1, NORMAL: 2, LOW: 3 };
                const clSignals = cluster
                  ? [...signals.filter((s) => cluster.signal_ids.includes(s.id))]
                      .sort((a, b) => priOrder[a.priority] - priOrder[b.priority])
                  : [];
                const topPriority = clSignals.reduce((best, s) =>
                  priOrder[s.priority] < priOrder[best] ? s.priority : best, 'LOW');
                const totalPeople = clSignals.reduce((n, s) => n + (s.people_count || 0), 0);
                const unresolved = clSignals.filter((s) => s.status !== 'RESOLVED').length;
                body = (
                  <ZoneDashboard
                    cluster={{ ...cluster, clSignals, topPriority, totalPeople, unresolved }}
                    signals={clSignals}
                    onBack={() => setOpenClusterId(null)}
                    onOpenSignal={openSignal}
                    aiState={aiState}
                  />
                );
              } else {
                body = (
                  <AuthorityDashboard
                    session={session}
                    signals={signals}
                    onOpenCluster={setOpenClusterId}
                  />
                );
              }
            }
          } else if (tab === 'map') {
            body = <MapScreen session={session} onOpenSignal={openSignal} />;
          } else if (tab === 'chat') {
            body = <ChatScreen session={session} role={session.role} />;
          } else if (tab === 'assistant') {
            body = <AssistantScreen aiState={aiState} session={session} onDownload={() => { setAiPanelOpen(true); startDownload(); }} />;
          } else if (tab === 'profile') {
            body = (
              <ProfileScreen
                session={session}
                peerCount={peerCount}
                battery={battery}
                aiState={aiState}
                onLogout={() => setSession(null)}
                onSwitchRole={() => setSession(null)}
              />
            );
          }

          return (
            <div className="min-h-screen bg-ink-950 text-zinc-100 max-w-md mx-auto relative shadow-2xl border-x border-zinc-900 sm:my-3">
              <TopBar
                session={session}
                peerCount={peerCount}
                battery={battery}
                aiState={aiState}
                onOpenAiPanel={() => setAiPanelOpen(true)}
                onOpenSettings={() => changeTab('profile')}
              />

              <main className="min-h-[calc(100vh-3rem-3rem)]">{body}</main>

              <BottomNav active={tab} onChange={changeTab} role={session.role} />

              {/* FAB — civilian only */}
              {session.role === 'CIVILIAN' && tab === 'home' && (
                <button
                  onClick={() => setComposeCategory('MEDICAL')}
                  className="fixed bottom-20 right-4 sm:right-[max(1rem,calc(50%-13rem))] z-20 w-14 h-14 flex items-center justify-center rounded-full"
                  style={{
                    background: '#FF4D4D',
                    boxShadow: '0 0 24px rgba(255,77,77,0.5), 0 4px 12px rgba(0,0,0,0.4)',
                  }}
                >
                  <Siren size={22} className="text-white" strokeWidth={2.4} />
                </button>
              )}

              <GemmaPanel
                open={aiPanelOpen}
                onClose={() => setAiPanelOpen(false)}
                aiState={aiState}
                onDownload={startDownload}
                onCancel={cancelDownload}
                onRetry={startDownload}
                isPrimary={session.role === 'CIVILIAN'}
              />

              {openSignalObj && (
                <SignalDetail
                  signal={openSignalObj}
                  role={session.role}
                  onClose={() => setOpenSignalId(null)}
                />
              )}

              {composeCategory && (
                <ComposeSheet
                  category={composeCategory}
                  onClose={() => setComposeCategory(null)}
                  onSubmit={submitSignal}
                />
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      });
    </script>
  </body>
</html>
