plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.disastermesh'
    compileSdk 34

    defaultConfig {
        applicationId "com.disastermesh"
        minSdk 24          // raised from 23: the LiteRT-LM on-device LLM engine requires API 24+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    kotlin {
        jvmToolchain(21)
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.gms:play-services-nearby:19.1.0'

    // Room
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // On-device LLM — LiteRT-LM engine (Google AI Edge).
    // Runs the Gemma 4 E2B `.litertlm` model locally on each device (V1), downloaded in-app
    // or sideloaded. This is the only LLM runtime; it replaces the older MediaPipe tasks-genai.
    // If a build fails on this line, bump to the latest litertlm release.
    implementation("com.google.ai.edge.litertlm:litertlm-android:0.11.0")

    // Coroutines — used by the LiteRT-LM Kotlin API (e.g. its streaming Flow).
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
    // For downloading the model
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
}
